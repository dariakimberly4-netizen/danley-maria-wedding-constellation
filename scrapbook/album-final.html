<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta name="theme-color" content="#f4eee5">
<title>Danley & Maria — Wedding Scrapbook</title>
<style>
:root{--paper:#fffdf8;--sage:#87947d;--sageDark:#65725d;--blush:#d8aaa2;--rose:#c88b84;--gold:#b9955c;--ink:#59463d;--muted:#8b776d;--brown:#735d4d;--danger:#b65e5a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at top,#fffdf9,#eee7dd 60%,#ddd3c6)}button{font:inherit}.stage{min-height:100vh;display:grid;place-items:center;padding:12px}
.cover{position:relative;width:min(700px,94vw);min-height:78vh;border-radius:12px 28px 28px 12px;background:linear-gradient(90deg,#7e8b74 0 58px,#f8f1e7 58px 100%);box-shadow:0 28px 70px rgba(72,55,43,.28);overflow:hidden}.cover:before{content:'';position:absolute;left:42px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.32)}.cover-inner{position:absolute;left:92px;right:30px;top:50%;transform:translateY(-50%);padding:42px 24px;text-align:center;border:1px solid rgba(185,149,92,.62)}.tiny{font:800 11px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#8a745b}.cover h1{margin:18px 0 8px;font-size:clamp(50px,10vw,84px);font-weight:500;line-height:.92}.cover h1 span{display:block;font-family:'Brush Script MT','Segoe Script',cursive;color:var(--rose);font-size:.72em;font-weight:400;margin:5px 0}.subtitle{font-family:'Brush Script MT','Segoe Script',cursive;font-size:30px;color:#7a665b;margin:10px 0 16px}.openBtn{margin-top:26px;border:0;border-radius:999px;background:var(--sageDark);color:#fff;min-height:50px;padding:14px 26px;font:850 14px Arial,sans-serif;cursor:pointer}.flower{position:absolute;border-radius:50%;background:radial-gradient(circle at 36% 36%,#fff7f1 0 25%,#efc5bb 26% 50%,#d89c94 51% 73%,#bc7872 74%);box-shadow:0 3px 9px rgba(90,60,50,.12)}.f1{width:82px;height:82px;left:66px;top:50px}.f2{width:58px;height:58px;left:122px;top:105px}.leaf{position:absolute;width:18px;height:44px;background:linear-gradient(#9cac90,#73836a);border-radius:80% 0 80% 0}.l1{left:50px;top:28px;transform:rotate(-35deg)}.l2{left:152px;top:58px;transform:rotate(45deg)}
.scrapbook{display:none;width:min(1180px,100%)}.scrapbook.show{display:block}.book{background:linear-gradient(180deg,#927966,#735d4d);padding:14px 14px 0;border-radius:26px;box-shadow:0 30px 78px rgba(70,54,42,.34);overflow:hidden}.spread{display:grid;grid-template-columns:1fr 1fr;min-height:680px;background:var(--paper);border-radius:16px 16px 5px 5px;overflow:hidden}.page{position:relative;padding:42px 38px 96px;background:linear-gradient(rgba(150,120,82,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(150,120,82,.014) 1px,transparent 1px),var(--paper);background-size:6px 6px;min-width:0}.page:first-child{border-right:1px solid #eadfce}.page:before{content:'';position:absolute;inset:14px;border:1px solid rgba(184,148,92,.22);pointer-events:none}.pageNo{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font:700 11px Arial,sans-serif;letter-spacing:.14em;color:#ac9d8f}.badge{display:inline-block;padding:7px 14px;background:#efe3d7;color:#89685e;font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(42px,6vw,64px);font-weight:400;line-height:1;color:#74806c;margin:26px 0 14px}.copy{font-size:17px;line-height:1.8;color:#746057}.dateCard{position:relative;width:min(340px,90%);margin:38px auto 0;padding:25px 18px;text-align:center;background:#f5e7d6;border:1px solid #e4ceb2;transform:rotate(1.4deg)}.dateCard:before{content:'';position:absolute;width:92px;height:24px;top:-13px;left:50%;transform:translateX(-50%) rotate(-3deg);background:rgba(215,191,150,.72)}.dateCard strong{display:block;font-size:30px;color:#718069;margin:8px 0}.dateCard small{font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9b7c5e}
.uploadPage{display:grid;place-items:center}.uploadCard{width:min(400px,94%);padding:36px 26px;text-align:center;background:#fff9f2;border:1px dashed #d1b9a4;box-shadow:0 12px 28px rgba(82,63,48,.1);transform:rotate(-.7deg)}.uploadIcon{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:#edf1e8;color:var(--sageDark);font-size:38px}.uploadCard h2{margin:0;font-family:'Brush Script MT','Segoe Script',cursive;font-size:42px;font-weight:400;color:#718069}.uploadCard p{font:14px/1.65 Arial,sans-serif;color:var(--muted);margin:10px auto 20px}.uploadMain{border:0;border-radius:999px;background:var(--sageDark);color:#fff;min-height:52px;padding:14px 22px;font:850 14px Arial,sans-serif;cursor:pointer}
.polaroid{position:relative;width:min(390px,92%);margin:28px auto 0;padding:12px 12px 40px;background:#fff;box-shadow:0 12px 28px rgba(75,57,43,.18);transform:rotate(-1.4deg)}.polaroid:before{content:'';position:absolute;top:-12px;left:50%;width:84px;height:24px;background:rgba(220,198,162,.8);transform:translateX(-50%) rotate(2deg)}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.caption{text-align:center;margin-top:13px;font-family:'Brush Script MT','Segoe Script',cursive;font-size:24px;color:#765f55}.photoDelete{display:block;margin:14px auto 0;border:0;border-radius:999px;background:#f3e0de;color:var(--danger);min-height:42px;padding:10px 17px;font:850 12px Arial,sans-serif;cursor:pointer}.blankCard{width:min(350px,92%);margin:100px auto 0;padding:30px 22px;text-align:center;background:#fff9f2;border:1px dashed #d3c0ad}.blankCard .heart{font-size:48px;color:var(--blush)}.blankCard h3{font-family:'Brush Script MT','Segoe Script',cursive;font-size:35px;font-weight:400;color:#74816d;margin:8px 0}.blankCard p{font:14px/1.65 Arial,sans-serif;color:var(--muted)}.blankUpload{margin-top:14px;border:0;border-radius:999px;background:var(--sage);color:#fff;min-height:44px;padding:11px 17px;font:850 12px Arial,sans-serif;cursor:pointer}.finished{position:absolute;right:30px;bottom:66px;border:2px solid #9dab93;color:#78896f;border-radius:6px;padding:7px 11px;font:800 10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-5deg)}
.controls{display:grid;grid-template-columns:auto auto 1fr auto auto auto auto;gap:9px;align-items:center;padding:12px 14px 14px;background:linear-gradient(180deg,#8d7461,#715b4a);border-radius:0 0 20px 20px}.controls button{border:1px solid rgba(255,255,255,.18);border-radius:9px;min-height:48px;padding:11px 14px;font:850 13px Arial,sans-serif;cursor:pointer}.prev,.next{background:#f8efe4;color:#624c41}.uploadBtn{background:#d8bf95;color:#59463d}.add{background:var(--sage);color:#fff}.finishBtn{background:var(--blush);color:#fff}.close{background:#eadfd3;color:#624c41}.indicator{text-align:center;font:800 11px Arial,sans-serif;letter-spacing:.08em;color:#fff7ed}.status{grid-column:1/-1;min-height:16px;text-align:center;color:#fff6e9;font:700 11px Arial,sans-serif}button:disabled{opacity:.45}
@media(max-width:800px){.stage{padding:0}.cover{width:100%;min-height:100vh;border-radius:0;background:linear-gradient(90deg,#7e8a74 0 48px,#f8f1e7 48px 100%)}.cover:before{left:34px}.cover-inner{left:70px;right:18px;padding:34px 18px}.f1{left:42px;top:40px}.f2{left:96px;top:96px}.l1{left:30px}.l2{left:128px}.book{padding:0;border-radius:0}.spread{grid-template-columns:1fr;min-height:auto;border-radius:0}.page{min-height:calc(100vh - 300px);padding:34px 24px 88px}.page:first-child{border-right:0}.page.second{display:none}.spread.showSecond .page:first-child{display:none}.spread.showSecond .page.second{display:block}.pageNo{display:none}.controls{grid-template-columns:1fr 1fr;border-radius:0;padding:12px}.indicator{grid-column:1/-1;order:-1;font-size:14px}.controls button{width:100%;min-height:58px;font-size:16px}.status{grid-column:1/-1}.script{font-size:46px}}
</style>
</head>
<body>
<div class="stage">
<section id="cover" class="cover"><span class="flower f1"></span><span class="flower f2"></span><span class="leaf l1"></span><span class="leaf l2"></span><div class="cover-inner"><div class="tiny">Digital Wedding Scrapbook</div><h1>Danley <span>&</span> Maria</h1><div class="subtitle">our little book of forever</div><div class="tiny">August 28, 2026</div><button id="openBtn" class="openBtn">Open the Scrapbook ♡</button></div></section>
<section id="scrapbook" class="scrapbook"><div class="book"><div id="spread" class="spread"></div><div class="controls"><button id="prevBtn" class="prev">← Previous</button><button id="uploadBtn" class="uploadBtn">＋ Upload Photo</button><div id="indicator" class="indicator"></div><button id="nextBtn" class="next">Next →</button><button id="addBtn" class="add">＋ Add Page</button><button id="finishBtn" class="finishBtn">✓ Finish Page</button><button id="closeBtn" class="close">Close</button><div id="status" class="status"></div></div></div></section>
<input id="photoInput" type="file" accept="image/*" multiple hidden>
</div>
<script src="photos.js"></script>
<script>
const STATIC=Array.isArray(window.WEDDING_PHOTOS)?window.WEDDING_PHOTOS:[];
const DB='dm-wedding-scrapbook-live',STORE='photos',PAGEKEY='dm_blank_pages_live',FINKEY='dm_finished_pages_live';
let localPhotos=[],extra=Math.max(0,parseInt(localStorage.getItem(PAGEKEY)||'0',10)||0),finished=new Set(JSON.parse(localStorage.getItem(FINKEY)||'[]')),spreadIndex=0;
const cover=document.getElementById('cover'),scrapbook=document.getElementById('scrapbook'),spread=document.getElementById('spread'),indicator=document.getElementById('indicator'),status=document.getElementById('status'),input=document.getElementById('photoInput');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadLocal(){localPhotos.forEach(p=>p.src&&URL.revokeObjectURL(p.src));localPhotos=[];try{const db=await openDB(),tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAll(),rows=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result||[]);req.onerror=()=>rej(req.error)});localPhotos=rows.map(r=>({id:r.id,src:URL.createObjectURL(r.blob),caption:r.caption||'Wedding memory ♡',kind:'local'}));db.close()}catch(e){status.textContent='Photo storage could not be opened.'}}
async function savePhotos(files){const imgs=[...files].filter(f=>f.type.startsWith('image/'));if(!imgs.length)return;status.textContent='Saving photos…';try{const db=await openDB();for(const f of imgs){await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add({blob:f,caption:f.name.replace(/\.[^.]+$/,'')||'Wedding memory ♡'});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}db.close();await loadLocal();spreadIndex=Math.max(0,Math.ceil(allPages().length/2)-1);render();if(innerWidth<=800&&spread.querySelector('.page.second')?.dataset.kind==='local')spread.classList.add('showSecond');status.textContent=`Added ${imgs.length} photo${imgs.length>1?'s':''}.`}catch(e){status.textContent='Could not save the selected photo.'}}
async function deletePhoto(id){id=Number(id);if(!id)return;if(!confirm('Delete this uploaded photo from the scrapbook?'))return;try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();await loadLocal();render();status.textContent='Photo deleted.'}catch(e){status.textContent='Could not delete this photo.'}}
function wrap(inner,n,kind='other'){return {n,kind,html:`<article class="page" data-page="${n}" data-kind="${kind}">${finished.has(n)?'<div class="finished">Finished</div>':''}${inner}<div class="pageNo">${String(n).padStart(2,'0')}</div></article>`}}
function intro(){return wrap(`<span class="badge">Welcome</span><h2 class="script">The day we said “I do”</h2><p class="copy">A keepsake for the smiles, happy tears, candid moments, and little memories we want to hold onto long after our wedding day.</p><div class="dateCard"><small>Our wedding day</small><strong>28 • 08 • 2026</strong><small>Danley & Maria</small></div>`,1,'intro')}
function uploadPage(n){return wrap(`<div class="uploadPage"><div class="uploadCard"><div class="uploadIcon">＋</div><h2>Upload Wedding Photos</h2><p>Choose photos from this device. They will be placed into the scrapbook and kept on this same browser.</p><button class="uploadMain" onclick="document.getElementById('photoInput').click()">＋ Upload Wedding Photo</button></div></div>`,n,'upload')}
function photoPage(p,n){const del=p.kind==='local'?`<button class="photoDelete" onclick="deletePhoto(${Number(p.id)})">🗑 Delete Photo</button>`:'';return wrap(`<span class="badge">Wedding Memory</span><div class="polaroid"><img class="photo" src="${esc(p.src)}" alt="Wedding memory"><div class="caption">${esc(p.caption||'A beautiful memory ♡')}</div>${del}</div>`,n,p.kind)}
function blankPage(n){return wrap(`<div class="blankCard"><div class="heart">♡</div><h3>New scrapbook page</h3><p>This page is ready for another selected wedding memory.</p><button class="blankUpload" onclick="document.getElementById('photoInput').click()">＋ Upload Photo</button></div>`,n,'blank')}
function allPages(){const arr=[intro(),uploadPage(2)];let n=3;for(const p of STATIC)arr.push(photoPage({...p,kind:'static'},n++));for(const p of localPhotos)arr.push(photoPage(p,n++));for(let i=0;i<extra;i++)arr.push(blankPage(n++));return arr}
function render(){const models=allPages(),pairs=[];for(let i=0;i<models.length;i+=2){const left=models[i],right=models[i+1]||wrap(`<div class="blankCard"><div class="heart">❦</div><h3>End of this spread</h3></div>`,i+2,'end');right.html=right.html.replace('class="page"','class="page second"');pairs.push([left,right])}spreadIndex=Math.max(0,Math.min(spreadIndex,pairs.length-1));const pair=pairs[spreadIndex];spread.innerHTML=pair[0].html+pair[1].html;spread.classList.remove('showSecond');indicator.textContent=`Pages ${pair[0].n}–${Math.min(pair[1].n,models.length)} of ${models.length}`;prevBtn.disabled=spreadIndex===0;nextBtn.disabled=spreadIndex===pairs.length-1}
function currentPageNo(){const pages=[...spread.querySelectorAll('.page')];if(innerWidth<=800)return Number((pages[spread.classList.contains('showSecond')?1:0]||pages[0])?.dataset.page||1);return Number(pages[0]?.dataset.page||1)}
const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
document.getElementById('openBtn').onclick=()=>{cover.style.display='none';scrapbook.classList.add('show');render();window.scrollTo(0,0)};
document.getElementById('closeBtn').onclick=()=>{scrapbook.classList.remove('show');cover.style.display='block';window.scrollTo(0,0)};
document.getElementById('uploadBtn').onclick=()=>input.click();
input.onchange=async()=>{await savePhotos(input.files);input.value=''};
document.getElementById('addBtn').onclick=()=>{extra++;localStorage.setItem(PAGEKEY,String(extra));spreadIndex=Math.ceil(allPages().length/2)-1;render();status.textContent='New scrapbook page added.'};
document.getElementById('finishBtn').onclick=()=>{const n=currentPageNo();finished.add(n);localStorage.setItem(FINKEY,JSON.stringify([...finished]));render();status.textContent=`Page ${n} marked finished.`};
prevBtn.onclick=()=>{if(innerWidth<=800&&spread.classList.contains('showSecond')){spread.classList.remove('showSecond');return}if(spreadIndex>0){spreadIndex--;render();if(innerWidth<=800)spread.classList.add('showSecond')}};
nextBtn.onclick=()=>{if(innerWidth<=800&&!spread.classList.contains('showSecond')){spread.classList.add('showSecond');return}const max=Math.ceil(allPages().length/2)-1;if(spreadIndex<max){spreadIndex++;render()}};
loadLocal();
</script>
</body>
</html>
