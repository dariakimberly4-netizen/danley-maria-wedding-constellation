<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta name="theme-color" content="#f4eee5">
<title>Danley & Maria — Wedding Scrapbook</title>
<style>
:root{--paper:#fffdf8;--cream:#f6efe4;--sage:#87947d;--sageDark:#66725f;--blush:#d7aaa1;--rose:#c78982;--gold:#b8945c;--ink:#59473d;--muted:#8a786e;--leather:#7f6857;--line:#eadfce;--danger:#a85d59}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at top,#fffdf9,#eee6dc 58%,#ddd3c6)}button{font:inherit}.stage{min-height:100vh;display:grid;place-items:center;padding:16px}
.cover{position:relative;width:min(720px,95vw);min-height:650px;border-radius:12px 30px 30px 12px;background:linear-gradient(90deg,#7e8a74 0 64px,#f8f1e7 64px 100%);box-shadow:0 32px 80px rgba(74,58,46,.3);overflow:hidden}.cover:after{content:'';position:absolute;left:47px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.28);box-shadow:8px 0 16px rgba(70,55,44,.14)}.linen{position:absolute;inset:0;background-image:linear-gradient(rgba(110,88,70,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(110,88,70,.02) 1px,transparent 1px);background-size:5px 5px}.coverFrame{position:absolute;left:112px;right:44px;top:50%;transform:translateY(-50%);padding:48px 30px;text-align:center;border:1px solid rgba(184,148,92,.68);background:rgba(255,253,248,.38)}.tiny{font:800 11px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#8a7459}.cover h1{font-size:clamp(48px,8vw,84px);line-height:.92;margin:18px 0 8px;font-weight:500}.cover h1 span{display:block;font-family:'Brush Script MT','Segoe Script',cursive;color:var(--rose);font-size:.72em;font-weight:400;margin:6px 0}.subtitle{font-family:'Brush Script MT','Segoe Script',cursive;font-size:32px;color:#7a665b;margin:10px 0 16px}.openBtn{margin-top:26px;border:0;border-radius:999px;background:var(--sageDark);color:white;min-height:50px;padding:14px 26px;font:850 14px Arial,sans-serif;cursor:pointer}.flowers{position:absolute;left:66px;top:32px;width:210px;height:230px;pointer-events:none}.flower{position:absolute;border-radius:50%;background:radial-gradient(circle at 36% 36%,#fff7f1 0 24%,#efc5bb 25% 50%,#d89c94 51% 73%,#bc7872 74%);box-shadow:0 3px 9px rgba(90,60,50,.12)}.f1{width:84px;height:84px;left:12px;top:78px}.f2{width:64px;height:64px;left:80px;top:28px}.f3{width:50px;height:50px;left:104px;top:126px}.leaf{position:absolute;width:18px;height:46px;background:linear-gradient(#9cac90,#73836a);border-radius:80% 0 80% 0}.l1{left:6px;top:38px;transform:rotate(-35deg)}.l2{left:132px;top:6px;transform:rotate(30deg)}.l3{left:154px;top:88px;transform:rotate(60deg)}.l4{left:42px;top:172px;transform:rotate(214deg)}
.scrapbook{display:none;width:min(1220px,100%)}.scrapbook.show{display:block}.book{position:relative;background:linear-gradient(180deg,#927966,#735d4d);padding:18px 18px 0;border-radius:30px;box-shadow:0 34px 86px rgba(70,54,42,.34);overflow:hidden}.book:after{content:'';position:absolute;left:50%;top:18px;bottom:86px;width:20px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(70,52,40,.14),rgba(255,255,255,.64),rgba(70,52,40,.12));z-index:5;pointer-events:none}.spread{display:grid;grid-template-columns:1fr 1fr;min-height:700px;background:var(--paper);border-radius:18px 18px 6px 6px;overflow:hidden}.page{position:relative;padding:46px 44px 104px;min-width:0;background:linear-gradient(rgba(150,120,82,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(150,120,82,.014) 1px,transparent 1px),var(--paper);background-size:6px 6px}.page:first-child{border-right:1px solid var(--line)}.page:before{content:'';position:absolute;inset:14px;border:1px solid rgba(184,148,92,.23);pointer-events:none}.corner{position:absolute;right:24px;top:20px;font-size:30px;color:var(--blush)}.corner2{position:absolute;right:54px;top:48px;font-size:29px;color:var(--sage)}.badge{display:inline-block;padding:7px 14px;background:#efe3d7;color:#8a6b60;font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(44px,6vw,66px);font-weight:400;line-height:1;color:#74806c;margin:28px 0 14px}.copy{font-size:17px;line-height:1.8;color:#746057;max-width:430px}.dateCard{position:relative;width:min(340px,88%);margin:42px auto 0;padding:26px 18px;text-align:center;background:#f5e7d6;border:1px solid #e4ceb2;box-shadow:0 10px 22px rgba(80,60,45,.1);transform:rotate(1.5deg)}.dateCard:before{content:'';position:absolute;width:94px;height:24px;background:rgba(215,191,150,.72);left:50%;top:-13px;transform:translateX(-50%) rotate(-3deg)}.dateCard small{display:block;font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9b7c5e}.dateCard strong{display:block;font-size:30px;color:#718069;margin:8px 0}.pageNo{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font:700 11px Arial,sans-serif;letter-spacing:.14em;color:#ad9d8f}
.uploadPage{display:grid;place-items:center}.uploadCard{position:relative;width:min(410px,94%);padding:38px 28px;text-align:center;background:#fff9f2;border:1px dashed #d1b9a4;box-shadow:0 14px 30px rgba(82,63,48,.1);transform:rotate(-.8deg)}.uploadCard:before{content:'';position:absolute;top:-12px;left:50%;width:90px;height:24px;background:rgba(218,195,157,.76);transform:translateX(-50%) rotate(2deg)}.uploadIcon{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:#edf1e8;color:var(--sageDark);font-size:38px}.uploadCard h2{margin:0;font-family:'Brush Script MT','Segoe Script',cursive;font-size:44px;font-weight:400;color:#718069}.uploadCard p{margin:10px auto 22px;max-width:320px;font:14px/1.65 Arial,sans-serif;color:var(--muted)}.uploadMain{border:0;border-radius:999px;background:var(--sageDark);color:white;min-height:52px;padding:14px 24px;font:850 14px Arial,sans-serif;cursor:pointer}.uploadHint{margin-top:14px;font:700 11px Arial,sans-serif;color:#9b7d65}
.polaroid{position:relative;width:min(390px,92%);margin:30px auto 0;padding:12px 12px 42px;background:#fff;box-shadow:0 12px 28px rgba(75,57,43,.18);transform:rotate(-1.5deg)}.polaroid:before{content:'';position:absolute;top:-12px;left:50%;width:84px;height:24px;background:rgba(220,198,162,.8);transform:translateX(-50%) rotate(2deg)}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee}.caption{text-align:center;margin-top:14px;font-family:'Brush Script MT','Segoe Script',cursive;font-size:24px;color:#765f55}.pageActions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.dangerMini{border:0;border-radius:999px;background:#f4e3e1;color:var(--danger);min-height:42px;padding:10px 16px;font:850 12px Arial,sans-serif;cursor:pointer}.blankCard{width:min(360px,92%);margin:100px auto 0;padding:30px 22px;text-align:center;background:#fff9f2;border:1px dashed #d3c0ad}.blankCard .heart{font-size:48px;color:var(--blush)}.blankCard h3{font-family:'Brush Script MT','Segoe Script',cursive;font-size:36px;font-weight:400;color:#74816d;margin:8px 0}.blankCard p{font:14px/1.65 Arial,sans-serif;color:var(--muted)}.blankCard button{margin-top:14px;border:0;border-radius:999px;min-height:44px;padding:11px 17px;font:850 12px Arial,sans-serif;cursor:pointer}.blankUpload{background:var(--sage);color:white}.blankDelete{background:#f4e3e1;color:var(--danger);margin-left:6px}.finished{position:absolute;right:34px;bottom:72px;border:2px solid #9dab93;color:#78896f;border-radius:6px;padding:7px 11px;font:800 10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-5deg)}
.controls{display:grid;grid-template-columns:auto auto auto 1fr auto auto auto auto;gap:9px;align-items:center;padding:13px 16px 15px;background:linear-gradient(180deg,#8d7461,#715b4a);border-radius:0 0 22px 22px}.controls button{border:1px solid rgba(255,255,255,.18);border-radius:9px;min-height:48px;padding:11px 15px;font:850 13px Arial,sans-serif;cursor:pointer}.prev,.next{background:#f8efe4;color:#624c41}.uploadBtn{background:#d8bf95;color:#59463d}.deleteBtn{background:#a85d59;color:white}.add{background:var(--sage);color:white}.finishBtn{background:var(--blush);color:white}.close{background:#eadfd3;color:#624c41}.indicator{text-align:center;font:800 11px Arial,sans-serif;letter-spacing:.08em;color:#fff7ed}.status{grid-column:1/-1;text-align:center;min-height:16px;color:#fff6e9;font:700 11px Arial,sans-serif}button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:800px){.stage{padding:8px}.cover{min-height:80vh;background:linear-gradient(90deg,#7e8a74 0 48px,#f8f1e7 48px 100%)}.cover:after{left:34px}.coverFrame{left:74px;right:22px;padding:36px 18px}.flowers{left:44px;transform:scale(.78);transform-origin:top left}.book{padding:8px 8px 0;border-radius:18px}.book:after{display:none}.spread{grid-template-columns:1fr;min-height:auto}.page{min-height:660px;padding:38px 24px 104px}.page:first-child{border-right:0}.page.second{display:none}.spread.showSecond .page:first-child{display:none}.spread.showSecond .page.second{display:block}.pageNo{display:none}.controls{grid-template-columns:1fr 1fr}.indicator{grid-column:1/-1;order:-1}.controls button{width:100%}.status{grid-column:1/-1}.script{font-size:49px}.cover h1{font-size:54px}}
</style>
</head>
<body>
<div class="stage">
<section id="cover" class="cover"><div class="linen"></div><div class="flowers"><span class="flower f1"></span><span class="flower f2"></span><span class="flower f3"></span><span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span><span class="leaf l4"></span></div><div class="coverFrame"><div class="tiny">Digital Wedding Scrapbook</div><h1>Danley <span>&</span> Maria</h1><div class="subtitle">our little book of forever</div><div class="tiny">August 28, 2026</div><button id="openBtn" class="openBtn">Open the Scrapbook ♡</button></div></section>
<section id="scrapbook" class="scrapbook"><div class="book"><div id="spread" class="spread"></div><div class="controls"><button id="prevBtn" class="prev">← Previous</button><button id="uploadBtn" class="uploadBtn">＋ Upload Photo</button><button id="deleteBtn" class="deleteBtn">🗑 Delete</button><div id="indicator" class="indicator"></div><button id="nextBtn" class="next">Next →</button><button id="addBtn" class="add">＋ Add Page</button><button id="finishBtn" class="finishBtn">✓ Finish Page</button><button id="closeBtn" class="close">Close</button><div id="status" class="status"></div></div></div></section>
<input id="photoInput" type="file" accept="image/*" multiple hidden>
</div>
<script src="photos.js"></script>
<script>
const STATIC=Array.isArray(window.WEDDING_PHOTOS)?window.WEDDING_PHOTOS:[];
const DB='dm-wedding-scrapbook-live',STORE='photos',PAGEKEY='dm_blank_pages_live',FINKEY='dm_finished_pages_live';
let localPhotos=[],extra=Math.max(0,parseInt(localStorage.getItem(PAGEKEY)||'0',10)||0),finished=new Set(JSON.parse(localStorage.getItem(FINKEY)||'[]')),spreadIndex=0;
const cover=document.getElementById('cover'),scrapbook=document.getElementById('scrapbook'),spread=document.getElementById('spread'),indicator=document.getElementById('indicator'),status=document.getElementById('status'),input=document.getElementById('photoInput');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadLocal(){localPhotos.forEach(p=>p.src&&URL.revokeObjectURL(p.src));localPhotos=[];try{const db=await openDB(),tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAll(),rows=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result||[]);req.onerror=()=>rej(req.error)});localPhotos=rows.map(r=>({id:r.id,src:URL.createObjectURL(r.blob),caption:r.caption||'Wedding memory ♡',kind:'local'}));db.close()}catch(e){status.textContent='Photo storage could not be opened.'}}
async function savePhotos(files){const imgs=[...files].filter(f=>f.type.startsWith('image/'));if(!imgs.length)return;status.textContent='Saving photos…';try{const db=await openDB();for(const f of imgs){await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add({blob:f,caption:f.name.replace(/\.[^.]+$/,'')||'Wedding memory ♡'});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}db.close();await loadLocal();spreadIndex=Math.max(0,Math.ceil(allPages().length/2)-1);render();status.textContent=imgs.length===1?'Photo added to the scrapbook.':`${imgs.length} photos added to the scrapbook.`}catch(e){status.textContent='Could not save the selected photo.'}}
async function deletePhoto(id){if(!confirm('Delete this uploaded photo from the scrapbook?'))return;try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(Number(id));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();await loadLocal();render();status.textContent='Photo deleted.'}catch(e){status.textContent='Could not delete this photo.'}}
function deleteBlank(){if(extra<1){status.textContent='There is no added blank page to delete.';return}if(!confirm('Delete this added scrapbook page?'))return;extra--;localStorage.setItem(PAGEKEY,String(extra));render();status.textContent='Page deleted.'}
function wrap(inner,n,kind='normal',ref=null,second=false){const stamp=finished.has(n)?'<div class="finished">Finished</div>':'';return {n,kind,ref,html:`<article class="page${second?' second':''}" data-kind="${kind}" data-ref="${ref??''}" data-page="${n}"><div class="corner">✿</div><div class="corner2">❦</div>${inner}${stamp}<div class="pageNo">${String(n).padStart(2,'0')}</div></article>`}}
function intro(){return wrap(`<span class="badge">Welcome</span><h2 class="script">The day we said “I do”</h2><p class="copy">A keepsake for the smiles, happy tears, candid moments, and little memories we want to hold onto long after our wedding day.</p><div class="dateCard"><small>Our wedding day</small><strong>28 • 08 • 2026</strong><small>Danley & Maria</small></div>`,1,'intro')}
function uploadPage(n){return wrap(`<div class="uploadPage"><div class="uploadCard"><div class="uploadIcon">＋</div><h2>Upload Wedding Photos</h2><p>Choose photos from this device. They will be placed into the scrapbook and kept on this same browser.</p><button type="button" class="uploadMain" onclick="document.getElementById('photoInput').click()">＋ Upload Wedding Photo</button><div class="uploadHint">JPG, PNG, WEBP and other phone photos</div></div></div>`,n,'upload')}
function photoPage(p,n){const isLocal=p.kind==='local';return wrap(`<span class="badge">Wedding Memory</span><div class="polaroid"><img class="photo" src="${esc(p.src)}" alt="Wedding memory"><div class="caption">${esc(p.caption||'A beautiful memory ♡')}</div>${isLocal?`<div class="pageActions"><button type="button" class="dangerMini" onclick="deletePhoto(${Number(p.id)})">🗑 Delete Photo</button></div>`:''}</div>`,n,isLocal?'local':'static',isLocal?p.id:null)}
function blankPage(n){return wrap(`<div class="blankCard"><div class="heart">♡</div><h3>New scrapbook page</h3><p>This page is ready for another selected wedding memory.</p><button type="button" class="blankUpload" onclick="document.getElementById('photoInput').click()">＋ Upload Photo</button><button type="button" class="blankDelete" onclick="deleteBlank()">🗑 Delete Page</button></div>`,n,'blank')}
function pageModels(){const arr=[intro(),uploadPage(2)];let n=3;for(const p of STATIC)arr.push(photoPage({...p,kind:'static'},n++));for(const p of localPhotos)arr.push(photoPage(p,n++));for(let i=0;i<extra;i++)arr.push(blankPage(n++));return arr}
function allPages(){return pageModels()}
function render(){const models=allPages(),pairs=[];for(let i=0;i<models.length;i+=2){const left=models[i],right=models[i+1]||wrap(`<div class="blankCard"><div class="heart">❦</div><h3>End of this spread</h3></div>`,i+2,'end');right.html=right.html.replace('class="page"','class="page second"');pairs.push([left,right])}spreadIndex=Math.max(0,Math.min(spreadIndex,pairs.length-1));const pair=pairs[spreadIndex];spread.innerHTML=pair[0].html+pair[1].html;spread.classList.remove('showSecond');indicator.textContent=`Pages ${pair[0].n}–${Math.min(pair[1].n,models.length)} of ${models.length}`;document.getElementById('prevBtn').disabled=spreadIndex===0;document.getElementById('nextBtn').disabled=spreadIndex===pairs.length-1}
function visibleEditable(){const pages=[...spread.querySelectorAll('.page')];if(innerWidth<=800){const second=spread.classList.contains('showSecond');return pages[second?1:0]||null}return pages.reverse().find(p=>['local','blank'].includes(p.dataset.kind))||pages.find(p=>['local','blank'].includes(p.dataset.kind))||null}
async function deleteCurrent(){const p=visibleEditable();if(!p){status.textContent='This page cannot be deleted. Upload a photo or add a page first.';return}if(p.dataset.kind==='local')await deletePhoto(p.dataset.ref);else if(p.dataset.kind==='blank')deleteBlank()}
function currentPageNo(){const p=visibleEditable()||spread.querySelector('.page');return Number(p?.dataset.page||1)}
function openBook(){cover.style.display='none';scrapbook.classList.add('show');render();window.scrollTo({top:0,behavior:'smooth'})}
function closeBook(){scrapbook.classList.remove('show');cover.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('openBtn').addEventListener('click',openBook);document.getElementById('closeBtn').addEventListener('click',closeBook);document.getElementById('uploadBtn').addEventListener('click',()=>input.click());document.getElementById('deleteBtn').addEventListener('click',deleteCurrent);input.addEventListener('change',async()=>{await savePhotos(input.files);input.value='' });document.getElementById('addBtn').addEventListener('click',()=>{extra++;localStorage.setItem(PAGEKEY,String(extra));spreadIndex=Math.ceil(allPages().length/2)-1;render();status.textContent='New scrapbook page added.'});document.getElementById('finishBtn').addEventListener('click',()=>{const n=currentPageNo();finished.add(n);localStorage.setItem(FINKEY,JSON.stringify([...finished]));render();status.textContent=`Page ${n} marked finished.`});document.getElementById('prevBtn').addEventListener('click',()=>{if(innerWidth<=800&&spread.classList.contains('showSecond')){spread.classList.remove('showSecond');return}if(spreadIndex>0){spreadIndex--;render();if(innerWidth<=800)spread.classList.add('showSecond')}});document.getElementById('nextBtn').addEventListener('click',()=>{if(innerWidth<=800&&!spread.classList.contains('showSecond')){spread.classList.add('showSecond');return}const max=Math.ceil(allPages().length/2)-1;if(spreadIndex<max){spreadIndex++;render()}});loadLocal();
</script>
</body>
</html>
