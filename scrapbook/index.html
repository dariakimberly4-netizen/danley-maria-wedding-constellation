<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#efe5d2">
<title>Danley & Maria — Wedding Scrapbook</title>
<style>
:root{--paper:#fffaf0;--paper2:#f8eedc;--ink:#3b3028;--gold:#b5904f;--rose:#a86e73;--navy:#183153;--line:#d9c8aa}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,serif;background:linear-gradient(135deg,#d9ccb6,#f1e7d6 55%,#d8c8ae);min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(31,39,50,.92);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;backdrop-filter:blur(8px)}
.brand{font-weight:700}.top button{border:0;border-radius:999px;padding:11px 14px;font-weight:800;background:#fff;color:var(--navy)}
.stage{max-width:1100px;margin:auto;padding:22px 12px 34px}.book{position:relative;background:#7e563a;padding:12px;border-radius:22px;box-shadow:0 24px 55px #533b2d55}
.spread{min-height:72vh;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:12px;overflow:hidden;position:relative}
.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(#eadbc3,#bfa98a,#eadbc3);box-shadow:0 0 18px #6a513733}
.page{padding:34px 30px 44px;position:relative;background-color:var(--paper);background-image:radial-gradient(#c9b58f55 1px,transparent 1px);background-size:23px 23px}
.page:nth-child(2){background-color:#fffdf7}.pageNo{position:absolute;bottom:14px;right:18px;font:12px Arial,sans-serif;color:#8b7c6b}.page:nth-child(2) .pageNo{left:18px;right:auto}
.coverpage{display:flex;align-items:center;justify-content:center;text-align:center;min-height:100%}.coverpage h1{font-size:clamp(42px,7vw,76px);font-weight:400;line-height:.95;margin:10px 0 14px}.coverpage .date{letter-spacing:.2em;font:700 12px Arial,sans-serif;color:var(--gold)}
.script{font-style:italic;color:var(--rose);font-size:21px}.heart{color:var(--rose)}
.polaroid{background:#fff;padding:10px 10px 28px;box-shadow:0 8px 18px #5b463d2b;border:1px solid #eadfcd;position:relative;max-width:330px;margin:8px auto;transform:rotate(-2deg)}
.polaroid:nth-child(even){transform:rotate(2deg)}.polaroid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee5d7}.caption{font-style:italic;text-align:center;margin-top:10px;font-size:15px}
.tape{position:absolute;top:-8px;left:38%;width:76px;height:22px;background:#e6d6aaad;transform:rotate(-4deg);z-index:2}
.memories{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.note{background:#fff3af;padding:18px;box-shadow:0 4px 10px #6c583622;transform:rotate(1deg);font-style:italic;line-height:1.5}.empty{display:grid;place-items:center;min-height:220px;text-align:center;color:#8c7d70;font-family:Arial,sans-serif;padding:25px}
.controls{display:flex;justify-content:center;gap:12px;padding:18px 0 4px}.controls button{min-width:120px;border:0;border-radius:999px;padding:14px 18px;background:var(--navy);color:#fff;font-weight:800;font-size:15px}.controls button:disabled{opacity:.35}
.overlay{position:fixed;inset:0;background:#1b1715cc;z-index:50;display:none;align-items:flex-end;justify-content:center;padding:12px}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fffaf0;border-radius:24px 24px 12px 12px;padding:24px;font-family:Arial,sans-serif}.sheet h2{font-family:Georgia,serif;font-size:30px;margin:0 0 8px}.close{float:right;border:0;background:#eee0cf;border-radius:50%;width:40px;height:40px;font-size:20px}.sheet label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:13px;border:1px solid #d7c7b1;border-radius:12px;font:inherit}.sheet textarea{min-height:88px}.pick,.submit{width:100%;padding:15px;border:0;border-radius:14px;font-weight:800;margin-top:12px}.pick{background:#f0e3cf;color:#332d2a}.submit{background:var(--navy);color:#fff}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.notice{display:none;margin-top:12px;padding:12px;background:#f3eadb;border-radius:10px}.modal{position:fixed;inset:0;background:#111d;z-index:80;display:none;align-items:center;justify-content:center;padding:18px}.modal img{max-width:95vw;max-height:88vh}.modal button{position:absolute;right:16px;top:16px;border:0;border-radius:50%;width:44px;height:44px;font-size:20px}
@media(max-width:720px){.stage{padding:10px 7px 25px}.book{padding:7px;border-radius:14px}.spread{display:block;min-height:76vh}.spread:after{display:none}.page{display:none;min-height:76vh;padding:28px 20px 45px}.page.active{display:block}.page:nth-child(2) .pageNo{left:auto;right:18px}.memories{grid-template-columns:1fr}.top{font-size:14px}.controls button{min-width:105px}}
</style></head>
<body>
<header class="top"><div class="brand">📖 Danley & Maria's Scrapbook</div><button onclick="openUpload()">＋ Add Memory</button></header>
<main class="stage"><div class="book"><div class="spread" id="spread"></div></div><div class="controls"><button id="prevBtn" onclick="prevPage()">← Previous</button><button id="nextBtn" onclick="nextPage()">Next →</button></div></main>
<div class="overlay" id="uploadSheet"><div class="sheet"><button class="close" onclick="closeUpload()">×</button><h2>Add a scrapbook memory</h2><p>Choose wedding photos and leave a note for Danley & Maria.</p><label>Your name</label><input id="guestName" placeholder="Your name"><label>Wedding moment</label><select id="category"><option>Wedding Memory</option><option>Ceremony</option><option>Couple</option><option>Family</option><option>Reception</option><option>Candid Moment</option><option>Guests</option><option>Photo Booth</option></select><input id="photos" type="file" accept="image/*" multiple hidden><button class="pick" onclick="photos.click()">📷 Take or Choose Photos</button><div class="preview" id="preview"></div><label>Message <span style="font-weight:400">(optional)</span></label><textarea id="message" maxlength="300" placeholder="A little note for the newlyweds..."></textarea><button class="submit" id="submitBtn" onclick="uploadAll()">💌 Add to Scrapbook</button><div class="notice" id="notice"></div></div></div>
<div class="modal" id="photoModal" onclick="if(event.target===this)this.style.display='none'"><button onclick="photoModal.style.display='none'">×</button><img id="modalImg" alt="Wedding memory"></div>
<script>
const API_URL="PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";const $=id=>document.getElementById(id);let items=[],page=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function photoCard(x,i){return `<div class="polaroid" style="transform:rotate(${i%2?-2:2}deg)"><div class="tape"></div><img loading="lazy" src="${esc(x.imageUrl)}" onclick="openPhoto('${esc(x.imageUrl)}')"><div class="caption">${x.message?`“${esc(x.message)}”<br>`:''}<b>— ${esc(x.guestName||'Wedding Guest')}</b></div></div>`}
function buildPages(){let pages=[`<section class="page coverpage active"><div><div class="date">AUGUST 28, 2026</div><div style="font-size:30px">✦ ♡ ✦</div><h1>Danley<br><span class="heart">&</span> Maria</h1><div class="script">Our Wedding Scrapbook</div><p style="max-width:330px;line-height:1.6;margin:25px auto 0">A collection of little moments, happy tears, warm hugs, and memories captured by the people we love.</p></div><span class="pageNo">Cover</span></section>`];
if(!items.length){pages.push(`<section class="page"><h2 style="font-size:34px">Our first blank page ✨</h2><div class="empty"><div><div style="font-size:58px">📷</div><p>No approved memories are showing yet.</p><p>Tap <b>Add Memory</b> to place the first photo into Danley & Maria's scrapbook.</p></div></div><span class="pageNo">1</span></section>`)}else{for(let i=0;i<items.length;i+=2){let chunk=items.slice(i,i+2);pages.push(`<section class="page"><div class="script">A moment to remember...</div><div class="memories">${chunk.map((x,j)=>photoCard(x,i+j)).join('')}</div>${chunk[0]?.category?`<div class="note">${esc(chunk[0].category)} • captured with love ♡</div>`:''}<span class="pageNo">${pages.length}</span></section>`)}}
if(items.length)pages.push(`<section class="page coverpage"><div><div style="font-size:50px">♡</div><h2 style="font-size:42px;margin:0">To be continued...</h2><p class="script">Every shared photo becomes part of their story.</p><button onclick="openUpload()" style="border:0;border-radius:999px;background:#183153;color:white;padding:14px 18px;font-weight:800">＋ Add another memory</button></div><span class="pageNo">♥</span></section>`);
$('spread').innerHTML=pages.join('');page=0;showPage()}
function showPage(){let p=[...document.querySelectorAll('.page')];if(innerWidth<=720){p.forEach((x,i)=>x.classList.toggle('active',i===page))}else{p.forEach(x=>x.style.display='none');let left=page-(page%2);if(p[left])p[left].style.display='block';if(p[left+1])p[left+1].style.display='block';page=left}$('prevBtn').disabled=page<=0;$('nextBtn').disabled=page>=[...document.querySelectorAll('.page')].length-(innerWidth<=720?1:2)}
function nextPage(){page+=innerWidth<=720?1:2;showPage();scrollTo({top:0,behavior:'smooth'})}function prevPage(){page=Math.max(0,page-(innerWidth<=720?1:2));showPage();scrollTo({top:0,behavior:'smooth'})}addEventListener('resize',showPage);
function openUpload(){$('uploadSheet').style.display='flex'}function closeUpload(){$('uploadSheet').style.display='none'}
$('photos').addEventListener('change',()=>{let fs=[...$('photos').files].slice(0,10);$('preview').innerHTML=fs.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')});function dataUrl(f){return new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}
function note(t){$('notice').textContent=t;$('notice').style.display='block'}
async function uploadAll(){if(API_URL.startsWith('PASTE_'))return note('The scrapbook design is ready, but photo uploading still needs the shared storage backend connected.');let fs=[...$('photos').files].slice(0,10);if(!fs.length)return note('Please choose at least one photo.');$('submitBtn').disabled=true;try{for(const f of fs){let payload={action:'upload',guestName:$('guestName').value.trim()||'Wedding Guest',message:$('message').value.trim(),category:$('category').value,filename:f.name,mimeType:f.type||'image/jpeg',image:await dataUrl(f)};let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}),o=await r.json();if(!o.ok)throw Error(o.error||'Upload failed')}note('Added with love ❤️');$('photos').value='';$('preview').innerHTML='';$('message').value='';await loadGallery()}catch(e){note('Could not upload: '+e.message)}finally{$('submitBtn').disabled=false}}
async function loadGallery(){if(API_URL.startsWith('PASTE_')){items=[];buildPages();return}try{let r=await fetch(API_URL+'?action=gallery'),o=await r.json();items=(o.items||[]).filter(x=>x.status==='approved');buildPages()}catch(e){items=[];buildPages()}}
function openPhoto(u){$('modalImg').src=u;$('photoModal').style.display='flex'}loadGallery();
</script></body></html>
