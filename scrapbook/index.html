<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee7dc">
<title>Danley & Maria — Wedding Scrapbook</title>
<style>
:root{--paper:#fffaf0;--paper2:#fbf2e6;--sage:#7e8d73;--sage2:#aab5a1;--blush:#d7a89f;--champ:#d8c19b;--gold:#b69762;--ink:#58463d;--muted:#8a776d;--wood:#776151}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 8%,#fffaf3 0,#ece3d7 55%,#d8ccbf 100%);color:var(--ink);font-family:Georgia,'Times New Roman',serif}button{font:inherit}.stage{min-height:100vh;display:grid;place-items:center;padding:14px}.hidden{display:none!important}
/* COVER */
.cover{width:min(610px,94vw);aspect-ratio:4/5;position:relative;border-radius:9px 28px 28px 9px;background:linear-gradient(90deg,rgba(44,48,38,.22),transparent 9%),linear-gradient(145deg,#78866e,#a7b39d);box-shadow:0 28px 70px rgba(68,55,45,.34),inset 0 0 0 2px rgba(255,255,255,.12);display:grid;place-items:center;padding:30px;overflow:hidden}.cover:before{content:'';position:absolute;left:30px;top:0;bottom:0;width:4px;background:rgba(255,255,255,.2);box-shadow:8px 0 20px rgba(0,0,0,.12)}.cover:after{content:'❦';position:absolute;bottom:26px;color:#f0ddb7;font-size:30px}.cover-floral{position:absolute;color:#f1e4cc;font-size:38px;opacity:.9}.cf1{left:36px;top:38px;transform:rotate(-20deg)}.cf2{right:38px;bottom:52px;transform:rotate(160deg)}.cover-inner{width:84%;min-height:70%;border:1px solid rgba(241,222,184,.85);padding:50px 22px;display:grid;place-content:center;text-align:center}.eyebrow{font:800 11px Arial,sans-serif;letter-spacing:.27em;text-transform:uppercase;color:#fff9ef}.cover h1{font-size:clamp(54px,11vw,92px);line-height:.9;font-weight:500;color:#fffaf1;margin:22px 0 12px}.amp{display:block;color:#f0ddb7;font-size:.64em;font-style:italic;margin:8px 0}.cover-copy{font-size:20px;font-style:italic;line-height:1.5;color:#fffaf3;margin:0 0 24px}.open-btn{justify-self:center;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:#fffaf1;color:#64705e;padding:15px 24px;min-height:50px;font:850 14px Arial,sans-serif;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.13)}
/* BOOK */
.scrapbook{width:min(1120px,100%)}.book{position:relative;background:linear-gradient(145deg,#8d7765,#6e594b);padding:12px;border-radius:25px;box-shadow:0 30px 78px rgba(64,50,40,.34)}.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:700px;border-radius:17px;overflow:hidden;background:var(--paper);box-shadow:inset 0 0 35px rgba(86,65,45,.08)}.spread:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:22px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(83,65,49,.1),rgba(255,255,255,.78),rgba(83,65,49,.1));pointer-events:none;z-index:7}.page{position:relative;min-width:0;padding:42px 38px 90px;overflow:hidden;background:linear-gradient(rgba(133,107,78,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(133,107,78,.018) 1px,transparent 1px),var(--paper);background-size:30px 30px}.page:first-child{border-right:1px solid #eadfce}.page:before,.page:after{position:absolute;z-index:0;color:#b0baaa;opacity:.85;font-size:42px}.page:first-child:before{content:'❧';left:22px;top:16px;transform:rotate(-22deg)}.page.second:after{content:'❧';right:22px;bottom:68px;transform:rotate(158deg)}.page>*{position:relative;z-index:1}.page-no{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:700 11px Arial,sans-serif;letter-spacing:.12em;color:#b0a296}.ribbon{display:inline-block;background:var(--blush);color:#fff;padding:8px 17px;transform:rotate(-2deg);font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 3px 0 rgba(0,0,0,.04)}.script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(40px,6vw,62px);font-weight:500;line-height:1;color:#6f7f68;margin:26px 0 13px}.copy{font-size:17px;line-height:1.78;color:#6e5d55;max-width:430px}.datecard{position:relative;width:min(340px,90%);margin:40px auto 0;padding:26px 18px;background:#f5e8d8;border:1px solid #ead6bc;text-align:center;transform:rotate(1.8deg);box-shadow:0 9px 20px rgba(84,62,44,.11)}.datecard:before{content:'';position:absolute;width:92px;height:25px;left:50%;top:-14px;transform:translateX(-50%) rotate(-3deg);background:rgba(214,191,153,.62)}.datecard span{font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a28260}.datecard b{display:block;font-size:30px;color:#6f7f68;margin:9px}.polaroid{position:relative;width:min(365px,92%);margin:24px auto;background:white;padding:12px 12px 36px;box-shadow:0 10px 26px rgba(73,56,43,.18);transform:rotate(var(--tilt,-2deg))}.polaroid:nth-child(even){--tilt:1.6deg}.polaroid:before{content:'';position:absolute;width:78px;height:23px;top:-12px;left:50%;transform:translateX(-50%) rotate(2deg);background:rgba(217,196,161,.72)}.photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:linear-gradient(145deg,#ead8cf,#acb8a3)}.caption{text-align:center;margin-top:12px;font-family:'Brush Script MT','Segoe Script',cursive;font-size:23px;color:#6c584e}.blank{min-height:510px;display:grid;place-items:center;text-align:center}.blank-box{width:min(360px,92%);padding:32px 24px;background:#fffaf4;border:1px dashed #cdbdaa;box-shadow:0 8px 18px rgba(76,58,43,.06)}.heart{font-size:54px;color:var(--blush)}.blank h3{font-family:'Brush Script MT','Segoe Script',cursive;font-size:36px;color:#6f7f68;font-weight:500;margin:8px 0}.blank p{margin:0;font:14px/1.65 Arial,sans-serif;color:var(--muted)}
/* CONTROLS LIVE INSIDE BOOK */
.page-tools{position:absolute;left:18px;right:18px;bottom:38px;display:flex;align-items:center;justify-content:center;gap:8px;z-index:10;pointer-events:auto}.page-tools button{border:1px solid #decfbd;border-radius:999px;min-height:42px;padding:10px 15px;cursor:pointer;font:850 12px Arial,sans-serif;box-shadow:0 4px 10px rgba(74,56,43,.09)}.prev,.next{background:#fffdf8;color:#69564c}.add{background:var(--sage);border-color:var(--sage)!important;color:#fff}.finish{background:var(--blush);border-color:var(--blush)!important;color:#fff}.indicator{font:800 11px Arial,sans-serif;color:#8c796e;min-width:88px;text-align:center}.status{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:700 11px Arial,sans-serif;color:#71806a;z-index:10}.finished-stamp{position:absolute;right:24px;top:22px;border:2px solid #91a087;color:#72806b;border-radius:4px;padding:7px 10px;transform:rotate(4deg);font:900 9px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;background:rgba(255,255,255,.45)}.close-tab{position:absolute;top:50%;right:-15px;transform:translateY(-50%) rotate(90deg);transform-origin:center;border:0;border-radius:9px 9px 0 0;background:#d9c19b;color:#5f4d43;padding:9px 14px;font:850 11px Arial,sans-serif;letter-spacing:.05em;cursor:pointer;z-index:20}
@media(max-width:760px){.stage{padding:7px}.cover{min-height:82vh;aspect-ratio:auto}.book{padding:7px}.spread{grid-template-columns:1fr;min-height:auto}.spread:after{display:none}.page{min-height:690px;padding:34px 21px 98px}.page:first-child{border-right:0}.page.second{display:none}.spread.show-second .page:first-child{display:none}.spread.show-second .page.second{display:block}.page-tools{left:10px;right:10px;gap:6px;flex-wrap:wrap}.page-tools button{padding:9px 12px;min-height:40px}.indicator{width:100%;order:-1}.page-no{display:none}.close-tab{right:-12px}.copy{font-size:16px}.script{font-size:44px}}
</style>
</head>
<body>
<div class="stage">
  <section id="cover" class="cover">
    <div class="cover-floral cf1">❧</div><div class="cover-floral cf2">❧</div>
    <div class="cover-inner">
      <div class="eyebrow">Wedding Scrapbook</div>
      <h1>Danley <span class="amp">&</span> Maria</h1>
      <p class="cover-copy">Little moments from our forever day</p>
      <div class="eyebrow">August 28, 2026</div>
      <button id="openBtn" class="open-btn">Open Our Scrapbook ♡</button>
    </div>
  </section>

  <section id="scrapbook" class="scrapbook hidden" aria-live="polite">
    <div class="book">
      <button id="closeBtn" class="close-tab">Close</button>
      <div id="spread" class="spread"></div>
    </div>
  </section>
</div>
<script src="photos.js"></script>
<script>
const PHOTOS=Array.isArray(window.WEDDING_PHOTOS)?window.WEDDING_PHOTOS:[];
const PAGE_KEY='dm_scrapbook_pages_redesign_v1',FINISH_KEY='dm_scrapbook_finish_redesign_v1';
let extra=Math.max(0,parseInt(localStorage.getItem(PAGE_KEY)||'0',10)||0),finished=localStorage.getItem(FINISH_KEY)==='1',spreadIndex=0;
const cover=document.getElementById('cover'),scrapbook=document.getElementById('scrapbook'),spread=document.getElementById('spread');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tools(){return `<div class="page-tools"><button class="prev" data-act="prev">←</button><span class="indicator" id="indicator"></span><button class="next" data-act="next">→</button><button class="add" data-act="add">＋ Add Page</button><button class="finish" data-act="finish">${finished?'✓ Finished':'✓ Finish Page'}</button></div><div class="status" id="status">${finished?'Saved on this device':''}</div>`}
function wrap(inner,n,second=false){return `<article class="page${second?' second':''}">${finished?'<div class="finished-stamp">Finished</div>':''}${inner}<div class="page-no">PAGE ${String(n).padStart(2,'0')}</div>${tools()}</article>`}
function basePages(){const p=[];p.push(wrap(`<span class="ribbon">Our Story</span><h2 class="script">The day we said “I do”</h2><p class="copy">A keepsake for the smiles, happy tears, quiet glances, laughter and little moments we want to remember long after our wedding day.</p><div class="datecard"><span>Our forever day</span><b>28 • 08 • 2026</b><span>Danley & Maria</span></div>`,1));if(PHOTOS.length){PHOTOS.forEach((x,i)=>p.push(wrap(`<span class="ribbon">Wedding Memory</span><div class="polaroid"><img class="photo" src="${esc(x.src)}" alt="Wedding memory"><div class="caption">${esc(x.caption||'A beautiful memory ♡')}</div></div>`,i+2)))}else p.push(wrap(`<div class="blank"><div class="blank-box"><div class="heart">♡</div><h3>Our memories begin here</h3><p>Danley and Maria can place their chosen wedding photos on these scrapbook pages.</p></div></div>`,2));return p}
function pages(){const p=basePages();for(let i=0;i<extra;i++){p.push(wrap(`<div class="blank"><div class="blank-box"><div class="heart">♡</div><h3>New memory page</h3><p>This page is ready for another selected wedding memory.</p></div></div>`,p.length+1))}return p}
function spreads(){const p=pages(),out=[];for(let i=0;i<p.length;i+=2)out.push([p[i],p[i+1]||wrap(`<div class="blank"><div class="blank-box"><div class="heart">❦</div><h3>More memories soon</h3></div></div>`,i+2,true)]);return out}
function render(){const s=spreads();spreadIndex=Math.max(0,Math.min(spreadIndex,s.length-1));spread.innerHTML=s[spreadIndex][0]+s[spreadIndex][1];spread.classList.remove('show-second');const label=`${spreadIndex*2+1}–${Math.min(spreadIndex*2+2,pages().length)} / ${pages().length}`;document.querySelectorAll('#indicator').forEach(x=>x.textContent=label);spread.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',act))}
function act(e){const a=e.currentTarget.dataset.act;if(a==='prev'){if(innerWidth<=760&&spread.classList.contains('show-second')){spread.classList.remove('show-second');return}if(spreadIndex>0){spreadIndex--;render();if(innerWidth<=760)spread.classList.add('show-second')}}if(a==='next'){if(innerWidth<=760&&!spread.classList.contains('show-second')){spread.classList.add('show-second');return}if(spreadIndex<spreads().length-1){spreadIndex++;render()}}if(a==='add'){extra++;finished=false;localStorage.setItem(PAGE_KEY,String(extra));localStorage.removeItem(FINISH_KEY);spreadIndex=spreads().length-1;render();setStatus('New page added.')}if(a==='finish'){finished=true;localStorage.setItem(FINISH_KEY,'1');render();setStatus('Page finished and saved on this device.')}}
function setStatus(t){document.querySelectorAll('#status').forEach(x=>x.textContent=t)}
document.getElementById('openBtn').addEventListener('click',()=>{cover.classList.add('hidden');scrapbook.classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})});document.getElementById('closeBtn').addEventListener('click',()=>{scrapbook.classList.add('hidden');cover.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})});
</script>
</body>
</html>
