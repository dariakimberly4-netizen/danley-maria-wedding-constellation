<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<title>Danley & Maria — Wedding Scrapbook</title>
<style>
:root{
  --paper:#fffdf8;--cream:#f7f0e5;--sage:#8c9a80;--sage-dark:#65735d;
  --blush:#d8aaa2;--rose:#c88b84;--gold:#b9955c;--ink:#59463d;
  --muted:#8a766c;--line:#e6d8c6;--leather:#816a58;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at top,#fffdf9,#eee7dd 58%,#ded5c9)}button{font:inherit}.stage{min-height:100vh;display:grid;place-items:center;padding:18px}

/* COVER */
.cover{position:relative;width:min(710px,95vw);min-height:650px;border-radius:12px 30px 30px 12px;background:linear-gradient(90deg,#7e8c74 0 62px,#f7efe4 62px 100%);box-shadow:0 30px 75px rgba(75,58,45,.28);overflow:hidden}
.cover:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(100,80,65,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(100,80,65,.02) 1px,transparent 1px);background-size:5px 5px}.spine-line{position:absolute;left:45px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25);box-shadow:8px 0 16px rgba(75,58,45,.14)}
.cover-card{position:absolute;left:112px;right:46px;top:50%;transform:translateY(-50%);border:1px solid rgba(185,149,92,.62);padding:48px 30px;text-align:center;background:rgba(255,253,248,.34)}
.cover-card .small{font:800 11px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#8b755b}.cover-card h1{margin:18px 0 8px;font-size:clamp(48px,8vw,82px);font-weight:500;line-height:.95}.cover-card h1 em{display:block;font-family:'Brush Script MT','Segoe Script',cursive;color:var(--rose);font-weight:400;font-size:.72em;margin:5px 0}.cover-card .sub{font-family:'Brush Script MT','Segoe Script',cursive;font-size:30px;color:#7b665b;margin:12px 0 18px}.cover-card .date{font:800 12px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9a7f62}.open-btn{margin-top:28px;border:0;border-radius:999px;background:var(--sage-dark);color:#fffdf7;min-height:50px;padding:15px 28px;font:850 14px Arial,sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(85,100,76,.22)}
.flower-cluster{position:absolute;left:68px;top:34px;width:200px;height:220px;pointer-events:none}.flower{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8f2 0 23%,#efc5bb 24% 48%,#d89c94 49% 71%,#bd7973 72%);box-shadow:0 3px 9px rgba(90,60,50,.12)}.f1{width:84px;height:84px;left:12px;top:72px}.f2{width:62px;height:62px;left:78px;top:24px}.f3{width:48px;height:48px;left:100px;top:122px}.leaf{position:absolute;width:18px;height:46px;background:linear-gradient(#9cae8f,#75866c);border-radius:80% 0 80% 0}.l1{left:8px;top:34px;transform:rotate(-36deg)}.l2{left:126px;top:5px;transform:rotate(30deg)}.l3{left:148px;top:84px;transform:rotate(58deg)}.l4{left:44px;top:166px;transform:rotate(214deg)}

/* OPEN BOOK */
.scrapbook{display:none;width:min(1200px,100%)}.scrapbook.show{display:block}.book{position:relative;background:linear-gradient(180deg,#907763,#745e4d);padding:18px 18px 0;border-radius:30px;box-shadow:0 34px 86px rgba(70,54,42,.34);overflow:hidden}.book:after{content:'';position:absolute;left:50%;top:18px;bottom:82px;width:20px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(70,52,40,.15),rgba(255,255,255,.64),rgba(70,52,40,.13));z-index:5;pointer-events:none}
.spread{display:grid;grid-template-columns:1fr 1fr;min-height:690px;border-radius:18px 18px 6px 6px;overflow:hidden;background:var(--paper)}.page{position:relative;padding:46px 44px 100px;min-width:0;background:linear-gradient(rgba(150,120,82,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(150,120,82,.014) 1px,transparent 1px),var(--paper);background-size:6px 6px}.page:first-child{border-right:1px solid #eadfce}.page:before{content:'';position:absolute;inset:14px;border:1px solid rgba(185,149,92,.22);pointer-events:none}.corner-flower{position:absolute;right:24px;top:20px;font-size:30px;color:var(--blush)}.corner-leaf{position:absolute;right:54px;top:48px;font-size:30px;color:var(--sage)}
.badge{display:inline-block;background:#f0e4d8;color:#8b6a60;padding:7px 15px;font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;transform:rotate(-1deg)}.script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(44px,6vw,66px);font-weight:400;line-height:1;color:#74816d;margin:28px 0 14px}.copy{font-size:17px;line-height:1.8;color:#746057;max-width:430px}.date-card{position:relative;width:min(340px,88%);margin:42px auto 0;padding:26px 18px;text-align:center;background:#f5e7d6;border:1px solid #e3cdb1;box-shadow:0 10px 22px rgba(80,60,45,.1);transform:rotate(1.5deg)}.date-card:before{content:'';position:absolute;width:94px;height:24px;background:rgba(215,191,150,.72);left:50%;top:-13px;transform:translateX(-50%) rotate(-3deg)}.date-card small{display:block;font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9c7b5d}.date-card strong{display:block;font-size:30px;color:#718069;margin:8px 0}.page-no{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font:700 11px Arial,sans-serif;letter-spacing:.14em;color:#ad9d8f}

/* UPLOAD PAGE */
.upload-page{display:grid;place-items:center}.upload-card{position:relative;width:min(390px,94%);padding:34px 26px 30px;text-align:center;background:#fff9f2;border:1px dashed #d2bba6;box-shadow:0 12px 28px rgba(82,63,48,.09);transform:rotate(-.7deg)}.upload-card:before{content:'';position:absolute;top:-12px;left:50%;width:88px;height:24px;background:rgba(218,195,157,.72);transform:translateX(-50%) rotate(2deg)}.upload-icon{width:78px;height:78px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:#edf1e8;color:var(--sage-dark);font-size:34px}.upload-card h2{margin:0;font-family:'Brush Script MT','Segoe Script',cursive;font-size:42px;font-weight:400;color:#72806a}.upload-card p{margin:10px auto 20px;max-width:310px;font:14px/1.65 Arial,sans-serif;color:var(--muted)}.upload-main{border:0;border-radius:999px;background:var(--sage-dark);color:white;min-height:50px;padding:14px 22px;font:850 14px Arial,sans-serif;cursor:pointer}.upload-hint{margin-top:14px;font:700 11px Arial,sans-serif;color:#a0836a}

/* PHOTO PAGE */
.polaroid{position:relative;width:min(390px,92%);margin:32px auto 0;padding:12px 12px 42px;background:#fff;box-shadow:0 12px 28px rgba(75,57,43,.18);transform:rotate(-1.5deg)}.polaroid:before{content:'';position:absolute;top:-12px;left:50%;width:84px;height:24px;background:rgba(220,198,162,.78);transform:translateX(-50%) rotate(2deg)}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee}.caption{text-align:center;margin-top:14px;font-family:'Brush Script MT','Segoe Script',cursive;font-size:24px;color:#765f55}.blank-card{width:min(360px,92%);margin:100px auto 0;padding:30px 22px;text-align:center;background:#fff9f2;border:1px dashed #d3c0ad}.blank-card .heart{font-size:48px;color:var(--blush)}.blank-card h3{font-family:'Brush Script MT','Segoe Script',cursive;font-size:36px;font-weight:400;color:#74816d;margin:8px 0}.blank-card p{font:14px/1.65 Arial,sans-serif;color:var(--muted)}.blank-card button{margin-top:14px;border:0;border-radius:999px;background:var(--sage);color:#fff;min-height:46px;padding:12px 18px;font:850 13px Arial,sans-serif;cursor:pointer}.finished{position:absolute;right:32px;bottom:72px;border:2px solid #9eae94;color:#78896f;border-radius:6px;padding:7px 11px;font:800 10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-5deg)}

/* CONTROLS INSIDE BOOK */
.controls{display:grid;grid-template-columns:auto auto 1fr auto auto auto auto;gap:9px;align-items:center;padding:13px 16px 15px;background:linear-gradient(180deg,#8d7461,#715b4a);border-radius:0 0 22px 22px}.controls button{border:1px solid rgba(255,255,255,.18);border-radius:9px;min-height:46px;padding:11px 15px;font:850 13px Arial,sans-serif;cursor:pointer}.prev,.next{background:#f8efe4;color:#624c41}.upload-btn{background:#d8bf95;color:#59463d}.add{background:var(--sage);color:#fff}.finish-btn{background:var(--blush);color:#fff}.close{background:#eadfd3;color:#624c41}.indicator{text-align:center;font:800 11px Arial,sans-serif;letter-spacing:.08em;color:#fff7ed}.status{grid-column:1/-1;text-align:center;min-height:16px;color:#fff6e9;font:700 11px Arial,sans-serif}
button:disabled{opacity:.45;cursor:not-allowed}

@media(max-width:800px){.stage{padding:8px}.cover{min-height:80vh;background:linear-gradient(90deg,#7e8c74 0 48px,#f7efe4 48px 100%)}.spine-line{left:34px}.cover-card{left:74px;right:22px;padding:36px 18px}.flower-cluster{left:44px;transform:scale(.78);transform-origin:top left}.book{padding:8px 8px 0;border-radius:18px}.book:after{display:none}.spread{grid-template-columns:1fr;min-height:auto}.page{min-height:650px;padding:38px 24px 100px}.page:first-child{border-right:0}.page.second{display:none}.spread.show-second .page:first-child{display:none}.spread.show-second .page.second{display:block}.page-no{display:none}.controls{grid-template-columns:1fr 1fr}.indicator{grid-column:1/-1;order:-1}.controls button{width:100%}.status{grid-column:1/-1}.script{font-size:49px}.cover-card h1{font-size:54px}}
</style>
</head>
<body>
<div class="stage">
  <section id="cover" class="cover">
    <div class="spine-line"></div>
    <div class="flower-cluster"><span class="flower f1"></span><span class="flower f2"></span><span class="flower f3"></span><span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span><span class="leaf l4"></span></div>
    <div class="cover-card"><div class="small">Digital Wedding Scrapbook</div><h1>Danley <em>&</em> Maria</h1><div class="sub">our little book of forever</div><div class="date">August 28, 2026</div><button id="openBtn" class="open-btn">Open the Scrapbook ♡</button></div>
  </section>

  <section id="scrapbook" class="scrapbook" aria-live="polite">
    <div class="book">
      <div id="spread" class="spread"></div>
      <div class="controls">
        <button id="prevBtn" class="prev">← Previous</button>
        <button id="uploadBtn" class="upload-btn">＋ Upload Photo</button>
        <div id="indicator" class="indicator"></div>
        <button id="nextBtn" class="next">Next →</button>
        <button id="addBtn" class="add">＋ Add Page</button>
        <button id="finishBtn" class="finish-btn">✓ Finish Page</button>
        <button id="closeBtn" class="close">Close</button>
        <div id="status" class="status"></div>
      </div>
    </div>
  </section>
  <input id="photoInput" type="file" accept="image/*" multiple hidden>
</div>

<script src="photos.js"></script>
<script>
const STATIC_PHOTOS=Array.isArray(window.WEDDING_PHOTOS)?window.WEDDING_PHOTOS:[];
const DB_NAME='dm-wedding-scrapbook-v2',STORE='photos';
const PAGE_KEY='dm_scrapbook_blank_pages_v5',FINISH_KEY='dm_scrapbook_finished_v5';
let localPhotos=[],extra=Math.max(0,parseInt(localStorage.getItem(PAGE_KEY)||'0',10)||0),finished=localStorage.getItem(FINISH_KEY)==='1',spreadIndex=0;
const cover=document.getElementById('cover'),scrapbook=document.getElementById('scrapbook'),spread=document.getElementById('spread'),indicator=document.getElementById('indicator'),status=document.getElementById('status'),input=document.getElementById('photoInput');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function loadLocal(){try{const db=await openDB();const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).getAll();const rows=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result||[]);req.onerror=()=>rej(req.error)});localPhotos=rows.map(r=>({src:URL.createObjectURL(r.blob),caption:r.caption||'Wedding memory ♡'}));db.close()}catch(e){status.textContent='Local photo storage is unavailable in this browser.'}}
async function savePhotos(files){const list=[...files].filter(f=>String(f.type).startsWith('image/'));if(!list.length){status.textContent='Please choose a photo.';return}try{const db=await openDB();for(const file of list){await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add({blob:file,caption:file.name.replace(/\.[^.]+$/,'')||'Wedding memory ♡'});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}db.close();await loadLocal();finished=false;localStorage.removeItem(FINISH_KEY);spreadIndex=spreads().length-1;render();status.textContent=`${list.length} photo${list.length>1?'s':''} added to the scrapbook.`}catch(e){status.textContent='The photo could not be saved on this device.'}}
function wrap(inner,n,second=false){return `<article class="page${second?' second':''}"><div class="corner-flower">✿</div><div class="corner-leaf">❦</div>${inner}${finished?'<div class="finished">Finished</div>':''}<div class="page-no">${String(n).padStart(2,'0')}</div></article>`}
function intro(){return wrap(`<span class="badge">Welcome</span><h2 class="script">The day we said “I do”</h2><p class="copy">A keepsake for the smiles, happy tears, candid moments, and little memories we want to hold onto long after our wedding day.</p><div class="date-card"><small>Our wedding day</small><strong>28 · 08 · 2026</strong><small>Danley & Maria</small></div>`,1)}
function uploadLanding(n){return wrap(`<div class="upload-page"><div class="upload-card"><div class="upload-icon">＋</div><h2>Add a wedding memory</h2><p>Choose a favorite photo from this device. It will be placed onto its own scrapbook page and kept in this browser.</p><button class="upload-main" type="button" data-upload>＋ Upload Wedding Photo</button><div class="upload-hint">No cloud account required</div></div></div>`,n)}
function photoPage(p,n){return wrap(`<span class="badge">Wedding Memory</span><div class="polaroid"><img class="photo" src="${esc(p.src)}" alt="Wedding memory"><div class="caption">${esc(p.caption||'A beautiful memory ♡')}</div></div>`,n)}
function blankPage(n){return wrap(`<div class="blank-card"><div class="heart">♡</div><h3>New scrapbook page</h3><p>This page is ready for another wedding memory.</p><button type="button" data-upload>＋ Upload Photo Here</button></div>`,n)}
function pages(){const out=[intro()];const all=[...STATIC_PHOTOS,...localPhotos];if(!all.length)out.push(uploadLanding(2));else all.forEach((p,i)=>out.push(photoPage(p,i+2)));for(let i=0;i<extra;i++)out.push(blankPage(out.length+1));return out}
function spreads(){const p=pages(),out=[];for(let i=0;i<p.length;i+=2){out.push([p[i],p[i+1]||uploadLanding(i+2)])}return out}
function bindPageUpload(){spread.querySelectorAll('[data-upload]').forEach(b=>b.addEventListener('click',()=>input.click()))}
function render(){const s=spreads();spreadIndex=Math.max(0,Math.min(spreadIndex,s.length-1));spread.innerHTML=s[spreadIndex][0]+s[spreadIndex][1].replace('class="page"','class="page second"');spread.classList.remove('show-second');bindPageUpload();indicator.textContent=`Pages ${spreadIndex*2+1}–${Math.min(spreadIndex*2+2,pages().length)} of ${pages().length}`;prevBtn.disabled=spreadIndex===0;nextBtn.disabled=spreadIndex===s.length-1;finishBtn.textContent=finished?'✓ Page Finished':'✓ Finish Page';if(finished)status.textContent='Scrapbook saved on this device.'}
async function openBook(){cover.style.display='none';scrapbook.classList.add('show');await loadLocal();render();window.scrollTo({top:0,behavior:'smooth'})}
function closeBook(){scrapbook.classList.remove('show');cover.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
openBtn.addEventListener('click',openBook);closeBtn.addEventListener('click',closeBook);uploadBtn.addEventListener('click',()=>input.click());input.addEventListener('change',async()=>{if(input.files?.length)await savePhotos(input.files);input.value=''})
prevBtn.addEventListener('click',()=>{if(innerWidth<=800&&spread.classList.contains('show-second')){spread.classList.remove('show-second');return}if(spreadIndex>0){spreadIndex--;render();if(innerWidth<=800)spread.classList.add('show-second')}})
nextBtn.addEventListener('click',()=>{if(innerWidth<=800&&!spread.classList.contains('show-second')){spread.classList.add('show-second');return}if(spreadIndex<spreads().length-1){spreadIndex++;render()}})
addBtn.addEventListener('click',()=>{extra++;finished=false;localStorage.setItem(PAGE_KEY,String(extra));localStorage.removeItem(FINISH_KEY);spreadIndex=spreads().length-1;render();status.textContent='A new scrapbook page was added.'})
finishBtn.addEventListener('click',()=>{finished=true;localStorage.setItem(FINISH_KEY,'1');render();status.textContent='Page finished and saved on this device.'})
</script>
</body>
</html>
