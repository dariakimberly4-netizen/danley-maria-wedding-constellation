<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2ece2">
<title>Danley & Maria — Wedding Scrapbook</title>
<style>
:root{
  --ivory:#fbf7ef;
  --paper:#fffdf8;
  --sage:#8f9b82;
  --sage-dark:#68745e;
  --blush:#d6a89f;
  --rose:#c98e87;
  --champagne:#d7bf95;
  --gold:#b49358;
  --ink:#5a463c;
  --muted:#8b786e;
  --line:#e6d8c5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at 50% 8%,#fffdf8 0,#f3ede3 46%,#e8dfd3 100%)}
button{font:inherit}
.stage{min-height:100vh;display:grid;place-items:center;padding:22px 14px 34px}

/* CLOSED ALBUM */
.album-cover{position:relative;width:min(720px,94vw);aspect-ratio:1.18/1;max-height:86vh;background:linear-gradient(90deg,#7d8a72 0 66px,#f8f1e7 66px 100%);border-radius:12px 28px 28px 12px;box-shadow:0 32px 80px rgba(75,59,47,.28),inset 0 0 0 1px rgba(255,255,255,.55);overflow:hidden}
.album-cover:before{content:'';position:absolute;left:48px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.28);box-shadow:8px 0 16px rgba(76,65,53,.12)}
.linen{position:absolute;inset:0;background-image:linear-gradient(rgba(120,103,84,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(120,103,84,.025) 1px,transparent 1px);background-size:5px 5px;pointer-events:none}
.gold-corner{position:absolute;width:72px;height:72px;border-color:var(--gold);opacity:.9}.gold-corner.tl{top:20px;left:88px;border-top:3px solid var(--gold);border-left:3px solid var(--gold)}.gold-corner.br{right:22px;bottom:20px;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold)}
.cover-content{position:absolute;left:110px;right:44px;top:50%;transform:translateY(-50%);text-align:center;padding:42px 32px;border:1px solid rgba(180,147,88,.62)}
.kicker{font-family:Arial,sans-serif;font-weight:800;letter-spacing:.26em;text-transform:uppercase;font-size:11px;color:#877359}
.cover-content h1{margin:18px 0 4px;font-size:clamp(46px,8vw,82px);font-weight:500;line-height:.95;color:#6c584a}
.cover-content h1 span{display:block;font-family:'Brush Script MT','Segoe Script',cursive;color:var(--rose);font-size:.78em;font-weight:400;margin:6px 0}
.cover-sub{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(24px,4vw,36px);color:#80675b;margin:10px 0 14px}
.cover-date{font:800 12px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#987d61}
.open-btn{margin-top:26px;border:0;background:var(--sage-dark);color:#fffdf7;border-radius:999px;padding:15px 26px;min-height:50px;font:850 14px Arial,sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(88,104,78,.2)}
.open-btn:active{transform:translateY(1px)}

/* FLORALS */
.floral{position:absolute;left:80px;top:24px;width:210px;height:230px;pointer-events:none}
.rose{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fff6ef 0 24%,#e8b8ac 25% 52%,#c98880 53% 76%,#b8746d 77%);box-shadow:0 3px 9px rgba(95,67,56,.12)}
.r1{width:86px;height:86px;left:16px;top:72px}.r2{width:66px;height:66px;left:78px;top:30px}.r3{width:52px;height:52px;left:88px;top:124px}
.leaf{position:absolute;width:18px;height:44px;background:linear-gradient(#9cab8d,#77866c);border-radius:80% 0 80% 0;transform-origin:bottom center}.l1{left:6px;top:32px;transform:rotate(-38deg)}.l2{left:118px;top:4px;transform:rotate(30deg)}.l3{left:143px;top:84px;transform:rotate(56deg)}.l4{left:38px;top:160px;transform:rotate(-145deg)}.l5{left:132px;top:154px;transform:rotate(132deg)}
.sprig{position:absolute;width:90px;height:1px;background:#b49a6b;transform-origin:left center}.s1{left:15px;top:60px;transform:rotate(-48deg)}.s2{left:118px;top:86px;transform:rotate(35deg)}
.sprig:before,.sprig:after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:#c9aa72;top:-3px}.sprig:before{left:30px}.sprig:after{left:62px}

/* OPEN BOOK */
.scrapbook{display:none;width:min(1180px,100%)}
.scrapbook.show{display:block}
.book-shell{position:relative;background:linear-gradient(180deg,#907865,#745f50);padding:18px 18px 0;border-radius:30px;box-shadow:0 34px 85px rgba(72,56,43,.32)}
.book-shell:before{content:'';position:absolute;left:50%;top:18px;bottom:82px;width:18px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(70,51,40,.18),rgba(255,255,255,.45),rgba(70,51,40,.14));z-index:4;pointer-events:none}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:690px;background:var(--paper);border-radius:18px 18px 6px 6px;overflow:hidden;box-shadow:inset 0 0 36px rgba(94,70,46,.08)}
.page{position:relative;padding:46px 44px 92px;min-width:0;background:linear-gradient(rgba(159,126,86,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(159,126,86,.016) 1px,transparent 1px),var(--paper);background-size:6px 6px}
.page:first-child{border-right:1px solid #eadfce}
.page:before{content:'';position:absolute;inset:14px;border:1px solid rgba(195,164,112,.22);pointer-events:none}
.page-no{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font:700 11px Arial,sans-serif;letter-spacing:.15em;color:#ac9c8d}
.page-floral{position:absolute;right:18px;top:18px;width:92px;height:80px;opacity:.9}
.page-floral:before{content:'✿';position:absolute;right:8px;top:10px;font-size:28px;color:var(--blush)}
.page-floral:after{content:'❦';position:absolute;right:36px;top:38px;font-size:29px;color:var(--sage)}
.label{display:inline-block;padding:7px 14px;background:#efe3d7;color:#8d6c61;font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;transform:rotate(-1deg)}
.script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(42px,6vw,64px);font-weight:400;line-height:1;color:#75806d;margin:28px 0 14px}
.copy{font-size:17px;line-height:1.8;color:#766259;max-width:430px}
.date-card{position:relative;width:min(340px,88%);margin:42px auto 0;background:#f5e8d8;border:1px solid #e5cfb3;padding:26px 18px;text-align:center;transform:rotate(1.8deg);box-shadow:0 10px 22px rgba(84,63,47,.1)}
.date-card:before{content:'';position:absolute;width:94px;height:24px;background:rgba(214,191,151,.68);left:50%;top:-13px;transform:translateX(-50%) rotate(-3deg)}
.date-card small{display:block;font:800 10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9c7d5d}.date-card strong{display:block;font-size:30px;color:#74806b;margin:8px 0}
.polaroid{position:relative;width:min(380px,92%);margin:30px auto 0;background:#fff;padding:12px 12px 40px;box-shadow:0 12px 26px rgba(71,54,42,.18);transform:rotate(-1.4deg)}
.polaroid:before{content:'';position:absolute;top:-12px;left:50%;width:82px;height:24px;transform:translateX(-50%) rotate(2deg);background:rgba(222,200,163,.75)}
.photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:linear-gradient(145deg,#ead7cf,#aab59f)}
.caption{margin-top:13px;text-align:center;font-family:'Brush Script MT','Segoe Script',cursive;font-size:24px;color:#755f56}
.blank{min-height:480px;display:grid;place-items:center;text-align:center}.blank-card{width:min(340px,90%);padding:30px 22px;background:#fffaf4;border:1px dashed #d2c0ad;transform:rotate(-.6deg)}.blank-card .heart{font-size:52px;color:var(--blush)}.blank-card h3{font-family:'Brush Script MT','Segoe Script',cursive;font-size:36px;color:#76816e;margin:8px 0}.blank-card p{font:14px/1.65 Arial,sans-serif;color:var(--muted);margin:0}
.finished-stamp{position:absolute;right:34px;bottom:68px;border:2px solid #9cac92;color:#7d8c75;border-radius:6px;padding:7px 11px;font:800 10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-5deg);opacity:.88}

/* CONTROLS ARE PART OF THE BOOK */
.book-controls{display:grid;grid-template-columns:auto 1fr auto auto auto auto;gap:9px;align-items:center;padding:13px 16px 15px;background:linear-gradient(180deg,#8b7463,#715c4c);border-radius:0 0 22px 22px}
.book-controls button{border:1px solid rgba(255,255,255,.18);border-radius:9px;min-height:46px;padding:11px 16px;font:850 13px Arial,sans-serif;cursor:pointer}.prev,.next{background:#f7efe4;color:#624d42}.add{background:var(--sage);color:white}.finish{background:var(--blush);color:white}.close{background:#e9ddd0;color:#624d42}.indicator{text-align:center;font:800 11px Arial,sans-serif;letter-spacing:.08em;color:#fff7ed}.status{grid-column:1/-1;text-align:center;min-height:16px;color:#fff5e8;font:700 11px Arial,sans-serif}

@media(max-width:800px){
  .stage{padding:8px}.album-cover{aspect-ratio:auto;min-height:80vh;background:linear-gradient(90deg,#7d8a72 0 48px,#f8f1e7 48px 100%)}.album-cover:before{left:34px}.cover-content{left:72px;right:22px;padding:34px 18px}.floral{left:46px;transform:scale(.78);transform-origin:top left}.gold-corner.tl{left:62px}
  .book-shell{padding:8px 8px 0;border-radius:18px}.book-shell:before{display:none}.spread{grid-template-columns:1fr;min-height:auto}.page{min-height:650px;padding:38px 24px 98px}.page:first-child{border-right:0}.page.second{display:none}.spread.show-second .page:first-child{display:none}.spread.show-second .page.second{display:block}.page-no{display:none}
  .book-controls{grid-template-columns:1fr 1fr}.indicator{grid-column:1/-1;order:-1}.book-controls button{width:100%}.status{grid-column:1/-1}.script{font-size:48px}.cover-content h1{font-size:54px}
}
</style>
</head>
<body>
<div class="stage">
  <section id="cover" class="album-cover">
    <div class="linen"></div>
    <div class="gold-corner tl"></div><div class="gold-corner br"></div>
    <div class="floral"><span class="rose r1"></span><span class="rose r2"></span><span class="rose r3"></span><span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span><span class="leaf l4"></span><span class="leaf l5"></span><span class="sprig s1"></span><span class="sprig s2"></span></div>
    <div class="cover-content">
      <div class="kicker">Digital Wedding Scrapbook</div>
      <h1>Danley <span>&</span> Maria</h1>
      <div class="cover-sub">our little book of forever</div>
      <div class="cover-date">August 28, 2026</div>
      <button id="openBtn" class="open-btn">Open the Scrapbook ♡</button>
    </div>
  </section>

  <section id="scrapbook" class="scrapbook" aria-live="polite">
    <div class="book-shell">
      <div id="spread" class="spread"></div>
      <div class="book-controls">
        <button id="prevBtn" class="prev">← Previous</button>
        <div id="indicator" class="indicator"></div>
        <button id="nextBtn" class="next">Next →</button>
        <button id="addBtn" class="add">＋ Add Page</button>
        <button id="finishBtn" class="finish">✓ Finish Page</button>
        <button id="closeBtn" class="close">Close</button>
        <div id="status" class="status"></div>
      </div>
    </div>
  </section>
</div>

<script src="photos.js"></script>
<script>
const PHOTOS=Array.isArray(window.WEDDING_PHOTOS)?window.WEDDING_PHOTOS:[];
const PAGE_KEY='dm_scrapbook_extra_v3';
const FINISH_KEY='dm_scrapbook_finish_v3';
let extra=Math.max(0,parseInt(localStorage.getItem(PAGE_KEY)||'0',10)||0);
let finished=localStorage.getItem(FINISH_KEY)==='1';
let spreadIndex=0;
const cover=document.getElementById('cover');
const scrapbook=document.getElementById('scrapbook');
const spread=document.getElementById('spread');
const indicator=document.getElementById('indicator');
const status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function wrap(inner,n,second=false){return `<article class="page${second?' second':''}"><div class="page-floral"></div>${inner}${finished?'<div class="finished-stamp">Finished</div>':''}<div class="page-no">${String(n).padStart(2,'0')}</div></article>`}
function welcome(){return wrap(`<span class="label">Welcome</span><h2 class="script">The day we said “I do”</h2><p class="copy">A keepsake for the smiles, happy tears, candid moments, and little memories we want to hold onto long after our wedding day.</p><div class="date-card"><small>Our wedding day</small><strong>28 • 08 • 2026</strong><small>Danley & Maria</small></div>`,1)}
function photoPages(){
  const out=[];
  if(!PHOTOS.length){out.push(wrap(`<div class="blank"><div class="blank-card"><div class="heart">♡</div><h3>Waiting for memories</h3><p>Danley and Maria can place their chosen wedding photos here.</p></div></div>`,2));return out;}
  PHOTOS.forEach((p,i)=>out.push(wrap(`<span class="label">Wedding Memory</span><div class="polaroid"><img class="photo" src="${esc(p.src)}" alt="Wedding memory"><div class="caption">${esc(p.caption||'A beautiful memory ♡')}</div></div>`,i+2)));
  return out;
}
function blankPages(start){const out=[];for(let i=0;i<extra;i++){out.push(wrap(`<div class="blank"><div class="blank-card"><div class="heart">♡</div><h3>New scrapbook page</h3><p>This page is ready for another selected wedding memory.</p></div></div>`,start+i));}return out;}
function pages(){const p=[welcome()].concat(photoPages());return p.concat(blankPages(p.length+1));}
function spreads(){const p=pages(),o=[];for(let i=0;i<p.length;i+=2)o.push([p[i],p[i+1]||wrap(`<div class="blank"><div class="blank-card"><div class="heart">❦</div><h3>End of this spread</h3></div></div>`,i+2,true)]);return o;}
function render(){const s=spreads();spreadIndex=Math.max(0,Math.min(spreadIndex,s.length-1));spread.innerHTML=s[spreadIndex][0]+s[spreadIndex][1];spread.classList.remove('show-second');const total=pages().length;indicator.textContent=`Pages ${spreadIndex*2+1}–${Math.min(spreadIndex*2+2,total)} of ${total}`;prevBtn.disabled=spreadIndex===0;nextBtn.disabled=spreadIndex===s.length-1;finishBtn.textContent=finished?'✓ Finished':'✓ Finish Page';status.textContent=finished?'Saved on this device.':'';}
function openBook(){cover.style.display='none';scrapbook.classList.add('show');render();window.scrollTo({top:0,behavior:'smooth'});}
function closeBook(){scrapbook.classList.remove('show');cover.style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
openBtn.addEventListener('click',openBook);
closeBtn.addEventListener('click',closeBook);
prevBtn.addEventListener('click',()=>{if(innerWidth<=800&&spread.classList.contains('show-second')){spread.classList.remove('show-second');return;}if(spreadIndex>0){spreadIndex--;render();if(innerWidth<=800)spread.classList.add('show-second');}});
nextBtn.addEventListener('click',()=>{if(innerWidth<=800&&!spread.classList.contains('show-second')){spread.classList.add('show-second');return;}if(spreadIndex<spreads().length-1){spreadIndex++;render();}});
addBtn.addEventListener('click',()=>{extra++;finished=false;localStorage.setItem(PAGE_KEY,String(extra));localStorage.removeItem(FINISH_KEY);spreadIndex=spreads().length-1;render();status.textContent='A new scrapbook page was added.';});
finishBtn.addEventListener('click',()=>{finished=true;localStorage.setItem(FINISH_KEY,'1');render();status.textContent='Page finished and saved on this device.';});
</script>
</body>
</html>
