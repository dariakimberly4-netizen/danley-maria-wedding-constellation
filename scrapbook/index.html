<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee7dc">
<title>Danley & Maria — Digital Wedding Scrapbook</title>
<style>
:root{--ivory:#fffaf1;--paper:#fffdf7;--sage:#88947d;--sage2:#aeb9a4;--blush:#d9aaa0;--gold:#b89a62;--brown:#5a4439;--muted:#8a776d;--line:#e6d8c7;--cover:#8c7967}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#fffdf8,#eee7dc 58%,#ddd3c6);color:var(--brown);font-family:Georgia,'Times New Roman',serif}button{font:inherit}
.stage{min-height:100vh;display:grid;place-items:center;padding:16px}.cover{width:min(620px,94vw);aspect-ratio:4/5;max-height:86vh;position:relative;border-radius:10px 28px 28px 10px;background:linear-gradient(90deg,rgba(0,0,0,.13),transparent 8%),linear-gradient(145deg,#7e8a74,#aab59f);box-shadow:0 28px 70px rgba(67,55,46,.34);padding:30px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.cover:before{content:'';position:absolute;left:29px;top:0;bottom:0;width:3px;background:rgba(255,255,255,.2)}.cover:after{content:'❦';position:absolute;bottom:28px;font-size:30px;color:#efd9ad}.cover-inner{width:84%;border:1px solid rgba(239,217,173,.85);padding:42px 20px 54px}.eyebrow{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:800;color:#fff7eb}.cover h1{font-size:clamp(50px,11vw,90px);line-height:.88;margin:22px 0 10px;color:var(--ivory);font-weight:500}.cover .amp{display:block;color:#efd9ad;font-style:italic;font-size:.66em;margin:7px 0}.cover p{font-size:20px;font-style:italic;color:#fff9f1;line-height:1.5}.open{margin-top:26px;border:0;border-radius:999px;background:var(--ivory);color:#66715e;padding:15px 24px;font-family:Arial,sans-serif;font-weight:850;cursor:pointer;min-height:48px}
.scrapbook{display:none;width:min(1080px,100%);margin:auto}.scrapbook.show{display:block}.book{position:relative;background:var(--cover);padding:12px 12px 0;border-radius:24px;box-shadow:0 28px 70px rgba(68,55,45,.32);overflow:hidden}.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:680px;background:var(--paper);border-radius:16px 16px 6px 6px;overflow:hidden;box-shadow:inset 0 0 30px rgba(91,70,51,.08)}.spread:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:18px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(80,61,43,.08),rgba(255,255,255,.72),rgba(80,61,43,.08));pointer-events:none}.page{position:relative;padding:42px 38px 54px;background:linear-gradient(rgba(130,105,78,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(130,105,78,.02) 1px,transparent 1px),var(--paper);background-size:28px 28px;min-width:0}.page:first-child{border-right:1px solid var(--line)}.page-no{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:12px Arial,sans-serif;color:#aaa094}.label{display:inline-block;background:var(--blush);color:white;padding:7px 16px;transform:rotate(-2deg);font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(38px,6vw,60px);line-height:1;color:#6f7f68;margin:24px 0 12px;font-weight:500}.copy{font-size:17px;line-height:1.75;color:#6e5d55}.datecard{position:relative;margin:38px auto 0;width:min(330px,90%);background:#f6eadb;border:1px solid #ead7bd;padding:25px 18px;text-align:center;transform:rotate(2deg);box-shadow:0 8px 18px rgba(80,60,45,.11)}.datecard:before{content:'';position:absolute;width:90px;height:25px;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);background:rgba(213,190,151,.6)}.datecard b{display:block;font-size:30px;color:#6f7f68;margin:8px}.datecard span{font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a08361}.polaroid{position:relative;width:min(355px,92%);margin:24px auto;background:#fff;padding:12px 12px 34px;box-shadow:0 10px 24px rgba(74,57,43,.17);transform:rotate(-2deg)}.polaroid:before{content:'';position:absolute;width:74px;height:22px;top:-11px;left:50%;transform:translateX(-50%) rotate(2deg);background:rgba(215,193,157,.7)}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;background:linear-gradient(145deg,#ead8cf,#adb9a4);display:block}.caption{text-align:center;margin-top:12px;font-family:'Brush Script MT','Segoe Script',cursive;font-size:22px;color:#6e5d55}.blank{display:grid;place-items:center;text-align:center;min-height:520px}.blank-box{width:min(350px,92%);padding:30px 22px;border:1px dashed #ccbbaa;background:#fffaf4}.blank .heart{font-size:50px;color:var(--blush)}.blank h3{font-family:'Brush Script MT','Segoe Script',cursive;font-size:34px;color:#6f7f68;margin:8px 0}.blank p{font:14px/1.65 Arial,sans-serif;color:var(--muted)}
.book-controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px 14px 15px;background:linear-gradient(#917f6f,#7f6c5c);border-radius:0 0 18px 18px}.book-controls button{border:1px solid rgba(255,255,255,.18);border-radius:10px;min-height:46px;padding:12px 16px;font:850 13px Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.10)}.prev,.next{background:#f7efe5;color:var(--brown)}.add{background:var(--sage);color:white}.finish{background:var(--blush);color:white}.close{background:#efe2d5;color:var(--brown)}.page-indicator{min-width:130px;text-align:center;font:800 12px Arial,sans-serif;color:#fff8ef}.status{width:100%;text-align:center;min-height:18px;margin-top:2px;font:700 12px Arial,sans-serif;color:#fff7e8}.finished-note{position:absolute;right:22px;top:18px;background:#e6eadf;color:#66715e;border:1px solid #cbd4c4;padding:8px 12px;border-radius:999px;font:800 10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;z-index:3}
@media(max-width:760px){.stage{padding:8px}.cover{max-height:none;min-height:82vh}.book{padding:7px 7px 0;border-radius:18px}.spread{grid-template-columns:1fr;min-height:auto}.spread:after{display:none}.page{min-height:650px;padding:34px 22px 50px}.page:first-child{border-right:0}.page.second{display:none}.spread.show-second .page:first-child{display:none}.spread.show-second .page.second{display:block}.page-no{display:none}.book-controls{display:grid;grid-template-columns:1fr 1fr;padding:10px}.book-controls button{width:100%}.page-indicator{grid-column:1/-1;order:-1}.status{grid-column:1/-1}}
</style>
</head>
<body>
<div class="stage">
  <section id="cover" class="cover">
    <div class="cover-inner">
      <div class="eyebrow">Digital Wedding Scrapbook</div>
      <h1>Danley <span class="amp">&</span> Maria</h1>
      <p>A collection of little moments from our forever day</p>
      <div class="eyebrow">August 28, 2026</div>
      <button class="open" id="openBtn">Open the Scrapbook ♡</button>
    </div>
  </section>

  <section id="scrapbook" class="scrapbook" aria-live="polite">
    <div class="book">
      <div id="spread" class="spread"></div>
      <div class="book-controls">
        <button class="prev" id="prevBtn">← Previous</button>
        <span class="page-indicator" id="indicator"></span>
        <button class="next" id="nextBtn">Next →</button>
        <button class="add" id="addBtn">＋ Add Page</button>
        <button class="finish" id="finishBtn">✓ Finish Page</button>
        <button class="close" id="closeBtn">Close Scrapbook</button>
        <div id="status" class="status"></div>
      </div>
    </div>
  </section>
</div>
<script src="photos.js"></script>
<script>
const PHOTO_LIST=Array.isArray(window.WEDDING_PHOTOS)?window.WEDDING_PHOTOS:[];
const PAGE_KEY='dm_real_scrapbook_extra_pages_v2';
const FINISH_KEY='dm_real_scrapbook_finished_v2';
let extra=Math.max(0,parseInt(localStorage.getItem(PAGE_KEY)||'0',10)||0);
let finished=localStorage.getItem(FINISH_KEY)==='1';
let spreadIndex=0;
const cover=document.getElementById('cover'),book=document.getElementById('scrapbook'),spread=document.getElementById('spread'),indicator=document.getElementById('indicator'),status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function pageWrap(inner,n,second=false){return `<article class="page${second?' second':''}">${finished?'<div class="finished-note">Finished</div>':''}${inner}<div class="page-no">${String(n).padStart(2,'0')}</div></article>`}
function introPage(){return pageWrap(`<span class="label">Welcome</span><h2 class="script">The day we said “I do”</h2><p class="copy">This scrapbook is our keepsake for the smiles, happy tears, candid moments and memories we want to remember long after the wedding day.</p><div class="datecard"><span>Save the date</span><b>28 • 08 • 2026</b><span>Danley & Maria</span></div>`,1)}
function photoPages(){
  const out=[];
  if(!PHOTO_LIST.length){out.push(pageWrap(`<div class="blank"><div class="blank-box"><div class="heart">♡</div><h3>Waiting for memories</h3><p>Danley and Maria will place their favorite wedding photos here.</p></div></div>`,2));return out}
  PHOTO_LIST.forEach((p,i)=>out.push(pageWrap(`<span class="label">Wedding Memory</span><div class="polaroid"><img class="photo" src="${esc(p.src)}" alt="Wedding memory"><div class="caption">${esc(p.caption||'A beautiful memory ♡')}</div></div>`,i+2)));
  return out
}
function blankPages(start){const out=[];for(let i=0;i<extra;i++){const n=start+i;out.push(pageWrap(`<div class="blank"><div class="blank-box"><div class="heart">♡</div><h3>New scrapbook page</h3><p>This page is ready for another selected wedding memory.</p></div></div>`,n))}return out}
function allPages(){const pages=[introPage()].concat(photoPages());return pages.concat(blankPages(pages.length+1))}
function spreads(){const pages=allPages(),out=[];for(let i=0;i<pages.length;i+=2)out.push([pages[i],pages[i+1]||pageWrap(`<div class="blank"><div class="blank-box"><div class="heart">❦</div><h3>End of this spread</h3></div></div>`,i+2,true)]);return out}
function render(){const s=spreads();spreadIndex=Math.max(0,Math.min(spreadIndex,s.length-1));spread.innerHTML=s[spreadIndex][0]+s[spreadIndex][1];spread.classList.remove('show-second');indicator.textContent=`Pages ${spreadIndex*2+1}–${Math.min(spreadIndex*2+2,allPages().length)} of ${allPages().length}`;document.getElementById('prevBtn').disabled=spreadIndex===0;document.getElementById('nextBtn').disabled=spreadIndex===s.length-1;document.getElementById('finishBtn').textContent=finished?'✓ Page Finished':'✓ Finish Page';status.textContent=finished?'Scrapbook pages saved on this device.':''}
function openBook(){cover.style.display='none';book.classList.add('show');render();window.scrollTo({top:0,behavior:'smooth'})}
function closeBook(){book.classList.remove('show');cover.style.display='flex';window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('openBtn').addEventListener('click',openBook);document.getElementById('closeBtn').addEventListener('click',closeBook);
document.getElementById('prevBtn').addEventListener('click',()=>{if(innerWidth<=760&&spread.classList.contains('show-second')){spread.classList.remove('show-second');return}if(spreadIndex>0){spreadIndex--;render();if(innerWidth<=760)spread.classList.add('show-second')}});
document.getElementById('nextBtn').addEventListener('click',()=>{if(innerWidth<=760&&!spread.classList.contains('show-second')){spread.classList.add('show-second');return}if(spreadIndex<spreads().length-1){spreadIndex++;render()}});
document.getElementById('addBtn').addEventListener('click',()=>{extra++;finished=false;localStorage.setItem(PAGE_KEY,String(extra));localStorage.removeItem(FINISH_KEY);spreadIndex=spreads().length-1;render();status.textContent='A new scrapbook page was added.'});
document.getElementById('finishBtn').addEventListener('click',()=>{finished=true;localStorage.setItem(FINISH_KEY,'1');render();status.textContent='Page finished and saved on this device.'});
</script>
</body>
</html>
