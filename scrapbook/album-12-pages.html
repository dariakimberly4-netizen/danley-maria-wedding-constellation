<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta name="theme-color" content="#f4eee5">
<title>Danley & Maria — 12-Page Wedding Scrapbook</title>
<style>
:root{--paper:#fffdf8;--sage:#87947d;--sageDark:#65725d;--blush:#d8aaa2;--rose:#c88b84;--gold:#b9955c;--ink:#59463d;--muted:#8b776d;--brown:#735d4d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at top,#fffdf9,#eee7dd 60%,#ddd3c6);overscroll-behavior:none}.stage{min-height:100vh;display:grid;place-items:center;padding:12px}
.cover{position:relative;width:min(700px,94vw);min-height:78vh;border-radius:12px 28px 28px 12px;background:linear-gradient(90deg,#7e8b74 0 58px,#f8f1e7 58px 100%);box-shadow:0 28px 70px rgba(72,55,43,.28);overflow:hidden;cursor:pointer}.cover:before{content:'';position:absolute;left:42px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.32)}.cover-inner{position:absolute;left:92px;right:30px;top:50%;transform:translateY(-50%);padding:42px 24px;text-align:center;border:1px solid rgba(185,149,92,.62)}.tiny{font:800 11px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#8a745b}.cover h1{margin:18px 0 8px;font-size:clamp(50px,10vw,84px);font-weight:500;line-height:.92}.cover h1 span{display:block;font-family:'Brush Script MT','Segoe Script',cursive;color:var(--rose);font-size:.72em;font-weight:400;margin:5px 0}.subtitle{font-family:'Brush Script MT','Segoe Script',cursive;font-size:30px;color:#7a665b;margin:10px 0 16px}.openHint{margin-top:26px;display:inline-block;border-radius:999px;background:var(--sageDark);color:#fff;padding:14px 26px;font:850 14px Arial,sans-serif}.flower{position:absolute;border-radius:50%;background:radial-gradient(circle at 36% 36%,#fff7f1 0 25%,#efc5bb 26% 50%,#d89c94 51% 73%,#bc7872 74%);box-shadow:0 3px 9px rgba(90,60,50,.12)}.f1{width:82px;height:82px;left:66px;top:50px}.f2{width:58px;height:58px;left:122px;top:105px}.leaf{position:absolute;width:18px;height:44px;background:linear-gradient(#9cac90,#73836a);border-radius:80% 0 80% 0}.l1{left:50px;top:28px;transform:rotate(-35deg)}.l2{left:152px;top:58px;transform:rotate(45deg)}
.viewer{display:none;width:min(1180px,100%)}.viewer.show{display:block}.book{position:relative;background:linear-gradient(180deg,#927966,#735d4d);padding:14px;border-radius:26px;box-shadow:0 30px 78px rgba(70,54,42,.34);overflow:hidden}.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:680px;background:var(--paper);border-radius:16px;overflow:hidden;touch-action:pan-y}.page{position:relative;padding:42px 38px 72px;background:linear-gradient(rgba(150,120,82,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(150,120,82,.014) 1px,transparent 1px),var(--paper);background-size:6px 6px;min-width:0}.page:first-child{border-right:1px solid #eadfce}.page:before{content:'';position:absolute;inset:14px;border:1px solid rgba(184,148,92,.22);pointer-events:none}.pageNo{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font:700 11px Arial,sans-serif;letter-spacing:.14em;color:#ac9d8f}.badge{display:inline-block;padding:7px 14px;background:#efe3d7;color:#89685e;font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(42px,6vw,64px);font-weight:400;line-height:1;color:#74806c;margin:26px 0 14px}.copy{font-size:17px;line-height:1.8;color:#746057}.dateCard{position:relative;width:min(340px,90%);margin:38px auto 0;padding:25px 18px;text-align:center;background:#f5e7d6;border:1px solid #e4ceb2;transform:rotate(1.4deg)}.dateCard:before{content:'';position:absolute;width:92px;height:24px;top:-13px;left:50%;transform:translateX(-50%) rotate(-3deg);background:rgba(215,191,150,.72)}.dateCard strong{display:block;font-size:30px;color:#718069;margin:8px 0}.dateCard small{font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9b7c5e}.polaroid{position:relative;width:min(390px,92%);margin:28px auto 0;padding:12px 12px 40px;background:#fff;box-shadow:0 12px 28px rgba(75,57,43,.18);transform:rotate(-1.4deg)}.polaroid:before{content:'';position:absolute;top:-12px;left:50%;width:84px;height:24px;background:rgba(220,198,162,.8);transform:translateX(-50%) rotate(2deg)}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.caption{text-align:center;margin-top:13px;font-family:'Brush Script MT','Segoe Script',cursive;font-size:24px;color:#765f55}.memorySlot{width:min(365px,92%);margin:80px auto 0;padding:34px 24px;text-align:center;background:#fff9f2;border:1px dashed #d3c0ad;transform:rotate(var(--tilt,-.5deg));box-shadow:0 10px 24px rgba(80,60,45,.06)}.memorySlot .heart{font-size:44px;color:var(--blush)}.memorySlot h3{font-family:'Brush Script MT','Segoe Script',cursive;font-size:38px;font-weight:400;color:#74816d;margin:8px 0}.memorySlot p{font:14px/1.65 Arial,sans-serif;color:var(--muted);margin:0}.counter{text-align:center;padding:12px 0 2px;color:#fff7ed;font:800 12px Arial,sans-serif;letter-spacing:.08em}.gesture{text-align:center;padding:4px 0 10px;color:#f4e8da;font:700 11px Arial,sans-serif}.tapZone{position:absolute;top:0;bottom:0;width:24%;z-index:5}.tapZone.left{left:0}.tapZone.right{right:0}
@media(max-width:800px){.stage{padding:0}.cover{width:100%;min-height:100vh;border-radius:0;background:linear-gradient(90deg,#7e8b74 0 48px,#f8f1e7 48px 100%)}.cover:before{left:34px}.cover-inner{left:70px;right:18px;padding:34px 18px}.f1{left:42px;top:40px}.f2{left:96px;top:96px}.l1{left:30px}.l2{left:128px}.book{padding:0;border-radius:0;min-height:100vh}.spread{grid-template-columns:1fr;min-height:calc(100vh - 64px);border-radius:0}.page{min-height:calc(100vh - 64px);padding:34px 24px 72px}.page:first-child{border-right:0}.page.second{display:none}.spread.showSecond .page:first-child{display:none}.spread.showSecond .page.second{display:block}.pageNo{display:none}.counter{font-size:14px;padding-top:10px}.gesture{font-size:12px}.script{font-size:46px}.memorySlot{margin-top:70px}}
</style>
</head>
<body>
<div class="stage">
<section id="cover" class="cover" aria-label="Open scrapbook"><span class="flower f1"></span><span class="flower f2"></span><span class="leaf l1"></span><span class="leaf l2"></span><div class="cover-inner"><div class="tiny">12-Page Digital Wedding Scrapbook</div><h1>Danley <span>&</span> Maria</h1><div class="subtitle">our little book of forever</div><div class="tiny">August 28, 2026</div><div class="openHint">Open All 12 Pages ♡</div></div></section>
<section id="viewer" class="viewer"><div class="book"><div id="spread" class="spread"></div><div id="counter" class="counter"></div><div class="gesture">Tap the left/right side or swipe to turn pages</div></div></section>
</div>
<script src="photos.js"></script>
<script>
const STATIC=Array.isArray(window.WEDDING_PHOTOS)?window.WEDDING_PHOTOS:[];
const DB='dm-wedding-scrapbook-live',STORE='photos';
let localPhotos=[],spreadIndex=0,touchX=null;
const cover=document.getElementById('cover'),viewer=document.getElementById('viewer'),spread=document.getElementById('spread'),counter=document.getElementById('counter');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const SECTIONS=['Getting Ready','The Ceremony','Our Vows','Just Married','Family','Friends','Reception','Little Moments','Together','Favorite Memory','Forever Begins'];
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadLocal(){try{const db=await openDB(),tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAll(),rows=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result||[]);req.onerror=()=>rej(req.error)});localPhotos=rows.map(r=>({id:r.id,src:URL.createObjectURL(r.blob),caption:r.caption||'Wedding memory ♡'}));db.close()}catch(e){localPhotos=[]}}
function wrap(inner,n){return `<article class="page"><div>${inner}</div><div class="pageNo">${String(n).padStart(2,'0')}</div></article>`}
function intro(){return wrap(`<span class="badge">Welcome</span><h2 class="script">The day we said “I do”</h2><p class="copy">A keepsake for the smiles, happy tears, candid moments, and little memories we want to hold onto long after our wedding day.</p><div class="dateCard"><small>Our wedding day</small><strong>28 • 08 • 2026</strong><small>Danley & Maria</small></div>`,1)}
function photoPage(p,n,title){return wrap(`<span class="badge">${esc(title)}</span><div class="polaroid"><img class="photo" src="${esc(p.src)}" alt="Wedding memory"><div class="caption">${esc(p.caption||title+' ♡')}</div></div>`,n)}
function placeholder(n,title){return wrap(`<span class="badge">Wedding Memory</span><div class="memorySlot"><div class="heart">♡</div><h3>${esc(title)}</h3><p>This page is ready for one of Danley and Maria’s selected wedding photos.</p></div>`,n)}
function allPages(){const photos=[...STATIC,...localPhotos];const pages=[intro()];for(let i=0;i<11;i++){const n=i+2,title=SECTIONS[i];pages.push(photos[i]?photoPage(photos[i],n,title):placeholder(n,title))}if(photos.length>11){for(let i=11;i<photos.length;i++)pages.push(photoPage(photos[i],pages.length+1,'Wedding Memory'))}return pages}
function pairs(){const pages=allPages(),out=[];for(let i=0;i<pages.length;i+=2)out.push([pages[i],pages[i+1]||placeholder(i+2,'One More Memory')]);return out}
function render(){const p=pairs();spreadIndex=Math.max(0,Math.min(spreadIndex,p.length-1));const pair=p[spreadIndex];spread.innerHTML=`<div class="tapZone left" id="leftZone"></div><div class="tapZone right" id="rightZone"></div>`+pair[0]+pair[1].replace('class="page"','class="page second"');spread.classList.remove('showSecond');counter.textContent=`Pages ${spreadIndex*2+1}–${Math.min(spreadIndex*2+2,allPages().length)} of ${allPages().length}`;bindZones()}
function bindZones(){document.getElementById('leftZone').onclick=prev;document.getElementById('rightZone').onclick=next}
function next(){if(innerWidth<=800&&!spread.classList.contains('showSecond')){spread.classList.add('showSecond');return}if(spreadIndex<pairs().length-1){spreadIndex++;render()}}
function prev(){if(innerWidth<=800&&spread.classList.contains('showSecond')){spread.classList.remove('showSecond');return}if(spreadIndex>0){spreadIndex--;render();if(innerWidth<=800)spread.classList.add('showSecond')}}
cover.addEventListener('click',async()=>{await loadLocal();cover.style.display='none';viewer.classList.add('show');render();scrollTo(0,0)});
spread.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});spread.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>45){dx<0?next():prev()}},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
</script>
</body>
</html>
