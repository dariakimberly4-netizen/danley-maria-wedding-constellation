<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danley & Maria — Wedding Scrapbook Admin</title>
<style>:root{--bg:#f8f4ee;--ink:#302b28;--line:#e4d8ca;--navy:#183153}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1100px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-family:Georgia,serif;font-weight:500;margin:4px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.item{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.item img{width:100%;aspect-ratio:4/3;object-fit:cover}.meta{padding:12px}.muted{color:#756c66;font-size:12px}.message{font-family:Georgia,serif;font-style:italic;margin:7px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button,.btn{padding:10px 12px;border:0;border-radius:11px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.dark{background:var(--navy);color:white}.light{background:#eee6dd;color:var(--ink)}.empty{text-align:center;padding:35px;color:#756c66}a{color:var(--ink)}code{word-break:break-all;font-size:11px}.setup{background:#fff7d9;border-color:#ead797}</style>
</head><body><main>
<div class="head"><div><div class="muted">ADMIN DASHBOARD • NO PASSWORD</div><h1>Danley & Maria</h1><div class="muted">Wedding Scrapbook • August 28, 2026</div></div><div><a href="index.html">← Guest scrapbook</a></div></div>
<div id="stats"><div class="card">Opening Cloudinary gallery…</div></div><div id="grid" class="grid"></div>
<script src="cloudinary-config.js"></script>
<script>
const C=window.WEDDING_CLOUDINARY||{};const $=id=>document.getElementById(id);const configured=()=>C.cloudName&&!String(C.cloudName).startsWith('PASTE_')&&C.uploadPreset&&!String(C.uploadPreset).startsWith('PASTE_');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function contextOf(r){return r?.context?.custom||r?.context||{}}function imageUrl(r){return `https://res.cloudinary.com/${encodeURIComponent(C.cloudName)}/image/upload/v${r.version}/${r.public_id}.${r.format}`}
function render(resources){const items=resources.map(r=>{const x=contextOf(r);return{imageUrl:imageUrl(r),guestName:x.guest_name||'Wedding Guest',message:x.message?.trim()||'',category:x.category||'Wedding Memory',createdAt:r.created_at||'',publicId:r.public_id}}).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));$('stats').innerHTML=`<div class="card"><b>${items.length}</b> wedding photo${items.length===1?'':'s'} in the shared Cloudinary scrapbook.</div>`;$('grid').innerHTML=items.length?items.map(x=>`<article class="item"><img loading="lazy" src="${esc(x.imageUrl)}" alt="Wedding upload"><div class="meta"><b>${esc(x.guestName)}</b><div class="muted">${esc(x.category)}${x.createdAt?' • '+new Date(x.createdAt).toLocaleString():''}</div>${x.message?`<div class="message">“${esc(x.message)}”</div>`:''}<div class="actions"><a class="btn dark" href="${esc(x.imageUrl)}" target="_blank" rel="noopener">View / Save</a><button class="light" onclick="copyId('${esc(x.publicId)}')">Copy Photo ID</button></div></div></article>`).join(''):'<div class="empty">No wedding photos have been uploaded yet.</div>'}
async function refresh(){if(!configured()){$('stats').innerHTML='<div class="card setup"><b>Cloudinary connection required.</b><p>The live site has been converted to Cloudinary. Add the Cloudinary cloud name and unsigned upload preset to <code>cloudinary-config.js</code> to activate guest uploads and this shared gallery.</p></div>';$('grid').innerHTML='';return}try{const url=`https://res.cloudinary.com/${encodeURIComponent(C.cloudName)}/image/list/${encodeURIComponent(C.tag)}.json?cb=${Date.now()}`;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Cloudinary client-side asset lists must be enabled for this gallery.');const o=await r.json();render(o.resources||[])}catch(e){$('stats').innerHTML=`<div class="card setup"><b>Gallery connection needs one Cloudinary setting.</b><p>${esc(e.message)}</p><p>In Cloudinary, enable the client-side <b>list</b> delivery type for the wedding tag gallery.</p></div>`;$('grid').innerHTML=''}}
function copyId(id){navigator.clipboard?.writeText(id);alert('Photo ID copied. Use the Cloudinary Media Library to delete or manage this photo securely.')}refresh();
</script></main></body></html>
