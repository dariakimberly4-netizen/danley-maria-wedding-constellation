<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Danley & Maria — Wedding Scrapbook Admin</title>
<style>
:root{--bg:#f8f4ee;--ink:#302b28;--line:#e4d8ca}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1050px;margin:auto;padding:30px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-family:Georgia,serif;font-weight:500;margin-bottom:6px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}button{padding:11px 14px;border:0;border-radius:12px;font-weight:700;cursor:pointer}.light{background:#eee6dd;color:var(--ink)}.danger{background:#7c2f2f;color:white}.ok{background:#355a41;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.item{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.item img{width:100%;aspect-ratio:4/3;object-fit:cover}.meta{padding:12px}.muted{color:#756c66;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:35px;color:#756c66}a{color:var(--ink)}</style>
</head>
<body><main>
<div class="head"><div><div class="muted">ADMIN DASHBOARD</div><h1>Danley & Maria</h1><div class="muted">Wedding Scrapbook • August 28, 2026</div></div><a href="index.html">← Guest scrapbook</a></div>
<div id="stats"><div class="card">Opening dashboard…</div></div><div id="grid" class="grid"></div>
<script>
const API_URL="PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(body){if(API_URL.startsWith("PASTE_"))throw new Error("Setup needed: connect the Google Apps Script backend first.");const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});const o=await r.json();if(!o.ok)throw new Error(o.error||"Request failed");return o}
async function call(action,id,status){return api({action,id,status})}
function render(items){const approved=items.filter(x=>x.status==="approved").length;const pending=items.filter(x=>x.status==="pending").length;$('stats').innerHTML=`<div class="card"><b>${items.length}</b> uploads &nbsp; • &nbsp; <b>${approved}</b> approved &nbsp; • &nbsp; <b>${pending}</b> pending</div>`;$('grid').innerHTML=items.length?items.map(x=>`<div class="item"><img src="${esc(x.imageUrl)}" alt="Wedding upload"><div class="meta"><b>${esc(x.guestName)}</b><div class="muted">${esc(x.category)} • ${esc(x.createdAt)}</div><div>${esc(x.message||"")}</div><div class="actions">${x.status!=="approved"?`<button class="ok" onclick="setStatus('${x.id}','approved')">Approve</button>`:""}<button class="light" onclick="setStatus('${x.id}','hidden')">Hide</button><button class="danger" onclick="removeItem('${x.id}')">Delete</button></div></div></div>`).join(""):'<div class="empty">No uploads yet.</div>'}
async function refresh(){try{const o=await call("adminList");render(o.items||[])}catch(e){$('stats').innerHTML=`<div class="card">${esc(e.message)}</div>`}}
async function setStatus(id,status){try{await call("setStatus",id,status);await refresh()}catch(e){alert(e.message)}}async function removeItem(id){if(!confirm("Delete this photo permanently?"))return;try{await call("delete",id);await refresh()}catch(e){alert(e.message)}}
refresh();
</script></main></body></html>
