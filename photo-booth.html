<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efe4">
<title>Danley & Maria — Wedding Scrapbook</title>
<meta http-equiv="refresh" content="0; url=./scrapbook/">
<link rel="canonical" href="./scrapbook/">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#fffaf2,#eadbc7);font-family:Arial,Helvetica,sans-serif;color:#332b27;text-align:center}
.card{width:min(440px,100%);background:#fffaf2;border:1px solid #e2d4c3;border-radius:28px;padding:30px 22px;box-shadow:0 20px 50px rgba(69,52,40,.12)}
.monogram{width:76px;height:76px;border:1px solid #d6c4ad;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font:28px Georgia,serif;color:#a76d73;background:#fffdf9}
h1{font:500 38px Georgia,serif;margin:8px 0}.date{font-size:12px;font-weight:800;letter-spacing:.18em;color:#b79153;text-transform:uppercase}.text{color:#7c7068;line-height:1.6}.btn{display:block;margin-top:20px;padding:16px 18px;border-radius:18px;background:#183153;color:#fff;text-decoration:none;font-weight:800}
</style>
<script>location.replace('./scrapbook/');</script>
</head>
<body>
<main class="card">
<div class="monogram">D♡M</div>
<div class="date">August 28, 2026</div>
<h1>Danley & Maria</h1>
<p class="text">Opening the wedding scrapbook…</p>
<a class="btn" href="./scrapbook/">OPEN SCRAPBOOK</a>
</main>
</body>
</html>
