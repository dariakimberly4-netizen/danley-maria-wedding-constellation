<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7efe4"><title>Danley & Maria — Wedding Photo Booth</title>
<style>
:root{--cream:#fffaf2;--ink:#332b27;--muted:#7d7068;--navy:#183153;--gold:#b79052;--rose:#a86d73;--line:#e4d6c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#fff 0,#f7efe4 50%,#dfd0bd 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:18px 14px 40px}.head{text-align:center;padding:10px 4px 18px}.date{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}h1{font:500 42px/1 Georgia,serif;margin:10px 0 5px}.sub{font:italic 18px Georgia,serif;color:var(--rose)}.card{background:rgba(255,250,242,.96);border:1px solid var(--line);border-radius:26px;padding:14px;box-shadow:0 22px 55px rgba(65,48,35,.13)}.viewport{position:relative;overflow:hidden;border-radius:20px;background:#1d1d1d;aspect-ratio:4/5}.viewport video,.viewport img{width:100%;height:100%;object-fit:cover;display:block}.viewport video{transform:scaleX(-1)}.frame{pointer-events:none;position:absolute;inset:0;z-index:3}.frame.classic{border:16px solid rgba(255,250,242,.96);box-shadow:inset 0 0 0 3px #b79052}.frame.classic:after{content:'Danley & Maria • 08.28.2026';position:absolute;left:0;right:0;bottom:16px;text-align:center;font:700 13px Georgia,serif;color:#6b5130;background:rgba(255,250,242,.88);padding:8px}.frame.floral{border:10px solid rgba(255,250,242,.92)}.frame.floral:before,.frame.floral:after{content:'✿  ❀  ♡';position:absolute;font-size:28px;color:#a86d73;letter-spacing:8px}.frame.floral:before{top:12px;left:14px}.frame.floral:after{bottom:12px;right:8px;transform:rotate(180deg)}.frame.minimal{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}.frame.minimal:after{content:'D  ♡  M';position:absolute;right:18px;bottom:18px;color:#fff;font:700 17px Georgia,serif;text-shadow:0 1px 5px #000}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.frameBtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-weight:800;color:var(--ink)}.frameBtn.active{background:#efe1cd;border-color:#c5a36d}.primary,.secondary,.scrap{width:100%;border-radius:18px;padding:16px 18px;margin-top:10px;font-size:15px;font-weight:850;cursor:pointer}.primary{border:0;background:var(--navy);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.scrap{display:block;text-align:center;text-decoration:none;border:0;background:var(--gold);color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.status{text-align:center;color:var(--muted);font-size:13px;line-height:1.45;margin:12px 4px 0}.hidden{display:none!important}.resultTitle{text-align:center;font:500 26px Georgia,serif;margin:7px 0 12px}@media(max-width:400px){h1{font-size:36px}.frameBtn{font-size:12px;padding:10px 5px}}
</style>
</head>
<body><div class="wrap">
<header class="head"><div class="date">August 28, 2026</div><h1>Danley & Maria</h1><div class="sub">Wedding Photo Booth</div></header>
<section class="card" id="cameraCard">
<div class="viewport"><video id="video" autoplay muted playsinline></video><div id="liveFrame" class="frame classic"></div></div>
<div class="controls"><button class="frameBtn active" onclick="setFrame('classic',this)">Classic</button><button class="frameBtn" onclick="setFrame('floral',this)">Floral</button><button class="frameBtn" onclick="setFrame('minimal',this)">Minimal</button></div>
<button class="primary" onclick="capturePhoto()">📷 Take Photo</button>
<input id="fallback" type="file" accept="image/*" capture="user" hidden><button class="secondary" onclick="fallback.click()">Choose Camera Photo Instead</button>
<div class="status" id="cameraStatus">Allow camera access when your browser asks.</div>
</section>
<section class="card hidden" id="resultCard">
<div class="resultTitle">Your Photo Booth Memory ♡</div><div class="viewport"><img id="resultImg" alt="Wedding photo booth result"></div>
<div class="row"><button class="secondary" onclick="retake()">↻ Retake</button><button class="secondary" onclick="savePhoto()">⬇ Save Photo</button></div>
<a class="scrap" href="./scrapbook/">📖 Open Digital Scrapbook</a>
<div class="status">Save your framed photo to your phone. Danley and Maria will manage the official scrapbook uploads.</div>
</section>
<canvas id="canvas" width="1080" height="1350" hidden></canvas>
</div>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let stream=null,currentFrame='classic',capturedBlob=null;
function setFrame(name,btn){currentFrame=name;document.getElementById('liveFrame').className='frame '+name;document.querySelectorAll('.frameBtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;document.getElementById('cameraStatus').textContent='Camera ready. Choose a frame, then take your photo.'}catch(e){document.getElementById('cameraStatus').textContent='Camera permission was not available. Use “Choose Camera Photo Instead.”'}}
function drawCover(source,w,h,mirror=false){const sw=source.videoWidth||source.naturalWidth,sh=source.videoHeight||source.naturalHeight,scale=Math.max(w/sw,h/sh),dw=sw*scale,dh=sh*scale,x=(w-dw)/2,y=(h-dh)/2;ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(source,-x-dw,y,dw,dh)}else ctx.drawImage(source,x,y,dw,dh);ctx.restore()}
function drawFrame(){const w=canvas.width,h=canvas.height;ctx.save();if(currentFrame==='classic'){ctx.strokeStyle='rgba(255,250,242,.98)';ctx.lineWidth=32;ctx.strokeRect(16,16,w-32,h-32);ctx.strokeStyle='#b79052';ctx.lineWidth=5;ctx.strokeRect(33,33,w-66,h-66);ctx.fillStyle='rgba(255,250,242,.9)';ctx.fillRect(0,h-112,w,112);ctx.fillStyle='#6b5130';ctx.textAlign='center';ctx.font='700 34px Georgia';ctx.fillText('Danley & Maria • 08.28.2026',w/2,h-44)}else if(currentFrame==='floral'){ctx.strokeStyle='rgba(255,250,242,.96)';ctx.lineWidth=24;ctx.strokeRect(12,12,w-24,h-24);ctx.fillStyle='#a86d73';ctx.font='64px serif';ctx.fillText('✿  ❀  ♡',40,85);ctx.save();ctx.translate(w-35,h-35);ctx.rotate(Math.PI);ctx.fillText('✿  ❀  ♡',0,0);ctx.restore()}else{ctx.strokeStyle='rgba(255,255,255,.88)';ctx.lineWidth=5;ctx.strokeRect(18,18,w-36,h-36);ctx.fillStyle='#fff';ctx.textAlign='right';ctx.font='700 44px Georgia';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=8;ctx.fillText('D  ♡  M',w-48,h-48)}ctx.restore()}
async function finishCanvas(){drawFrame();capturedBlob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.92));document.getElementById('resultImg').src=URL.createObjectURL(capturedBlob);document.getElementById('cameraCard').classList.add('hidden');document.getElementById('resultCard').classList.remove('hidden')}
async function capturePhoto(){if(!video.videoWidth)return document.getElementById('cameraStatus').textContent='Camera is not ready yet. Try again or choose a camera photo.';ctx.clearRect(0,0,canvas.width,canvas.height);drawCover(video,canvas.width,canvas.height,true);await finishCanvas()}
document.getElementById('fallback').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=async()=>{ctx.clearRect(0,0,canvas.width,canvas.height);drawCover(img,canvas.width,canvas.height,false);await finishCanvas();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)});
function retake(){capturedBlob=null;document.getElementById('resultCard').classList.add('hidden');document.getElementById('cameraCard').classList.remove('hidden')}
function savePhoto(){if(!capturedBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(capturedBlob);a.download='danley-maria-photo-booth.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
startCamera();
</script></body></html>
