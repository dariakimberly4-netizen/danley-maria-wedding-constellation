<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danley & Maria — Wedding Scrapbook</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#d7cab4,#f3eadb);font-family:Georgia,serif;color:#3b3028;min-height:100vh}.top{background:#20324b;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.top a{color:#20324b;background:#fff;text-decoration:none;padding:10px 14px;border-radius:999px;font:bold 14px Arial}.stage{max-width:1000px;margin:auto;padding:18px 10px}.book{background:#80583d;padding:10px;border-radius:18px;box-shadow:0 20px 45px #4c36284d}.spread{background:#fffaf0;min-height:78vh;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;position:relative}.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#d8c4a3;box-shadow:0 0 14px #5c473833}.page{padding:34px 26px;position:relative;background-color:#fffaf0;background-image:radial-gradient(#cbb69355 1px,transparent 1px);background-size:24px 24px;min-height:78vh}.page:nth-child(even){background-color:#fffdf7}.cover{display:flex;align-items:center;justify-content:center;text-align:center}.cover h1{font-size:clamp(45px,7vw,76px);font-weight:400;line-height:.95;margin:10px 0}.date{letter-spacing:.18em;font:700 12px Arial;color:#b5904f}.script{font-style:italic;color:#a86e73;font-size:22px}.polaroid{background:#fff;padding:10px 10px 28px;box-shadow:0 8px 18px #5b463d2b;border:1px solid #eadfcd;max-width:330px;margin:12px auto;transform:rotate(-2deg)}.polaroid:nth-child(even){transform:rotate(2deg)}.polaroid img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}.cap{text-align:center;font-style:italic;margin-top:10px}.memories{display:grid;grid-template-columns:1fr 1fr;gap:16px}.blank{display:grid;place-items:center;text-align:center;min-height:55vh;color:#857666;font-family:Arial}.controls{display:flex;gap:12px;justify-content:center;padding:16px}.controls button{padding:13px 18px;border:0;border-radius:999px;background:#20324b;color:#fff;font-weight:bold;min-width:120px}.controls button:disabled{opacity:.35}@media(max-width:720px){.spread{display:block}.spread:after{display:none}.page{display:none}.page.active{display:block}.memories{grid-template-columns:1fr}}</style></head><body><header class="top"><div>📖 Danley & Maria's Scrapbook</div><a href="photo-booth.html">📸 Photo Booth</a></header><main class="stage"><div class="book"><div class="spread" id="spread"></div></div><div class="controls"><button id="prev" onclick="move(-1)">← Previous</button><button id="next" onclick="move(1)">Next →</button></div></main><script>let page=0;const memories=[];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function build(){let p=[`<section class="page cover active"><div><div class="date">AUGUST 28, 2026</div><div style="font-size:34px">✦ ♡ ✦</div><h1>Danley<br>& Maria</h1><div class="script">Our Wedding Scrapbook</div><p style="max-width:330px;line-height:1.6;margin:22px auto">A collection of moments, laughter, hugs, and memories from our wedding day.</p></div></section>`];if(!memories.length)p.push(`<section class="page"><div class="script">Our first page...</div><div class="blank"><div><div style="font-size:64px">📷</div><h2>Wedding memories will live here</h2><p>Photos shared by family and friends will be arranged like a real scrapbook.</p></div></div></section>`);document.getElementById('spread').innerHTML=p.join('');show()}function show(){let p=[...document.querySelectorAll('.page')];if(innerWidth<=720){p.forEach((x,i)=>x.classList.toggle('active',i===page))}else{p.forEach(x=>x.style.display='none');let l=page-(page%2);if(p[l])p[l].style.display='block';if(p[l+1])p[l+1].style.display='block';page=l}prev.disabled=page<=0;next.disabled=page>=p.length-(innerWidth<=720?1:2)}function move(d){page=Math.max(0,page+d*(innerWidth<=720?1:2));show();scrollTo({top:0,behavior:'smooth'})}addEventListener('resize',show);build();</script></body></html>
